name: OS smoke

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      shutdown_panic_proof:
        description: Also run opt-in shutdown/panic proof modes on the disposable runner.
        required: false
        type: boolean
        default: false
      expected_ref:
        description: Optional branch/ref guard. Set this to the branch you meant to smoke; the job fails before toolchain install if the selected workflow ref differs.
        required: false
        type: string
      expected_sha:
        description: Optional exact commit guard. Set this to the main commit you meant to smoke; the job fails before toolchain install if GITHUB_SHA differs.
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Build and boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INPUT_EXPECTED_REF: ${{ inputs.expected_ref }}
      INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Confirm selected proof ref
        run: |
          set -euo pipefail

          if [ -n "${INPUT_EXPECTED_REF:-}" ] && [ "$GITHUB_REF_NAME" != "$INPUT_EXPECTED_REF" ]; then
            echo "expected_ref '$INPUT_EXPECTED_REF' does not match selected workflow ref '$GITHUB_REF_NAME'." >&2
            echo "Use the Run workflow branch selector or gh workflow run os-smoke.yml --ref '$INPUT_EXPECTED_REF'." >&2
            exit 1
          fi
          if [ -n "${INPUT_EXPECTED_SHA:-}" ] && [ "$GITHUB_SHA" != "$INPUT_EXPECTED_SHA" ]; then
            echo "expected_sha '$INPUT_EXPECTED_SHA' does not match selected workflow commit '$GITHUB_SHA'." >&2
            echo "Fetch/push main first, then rerun the post-merge cloud proof lane for the exact commit." >&2
            exit 1
          fi

          echo "Running OS smoke proof on ref '$GITHUB_REF_NAME' at commit '$GITHUB_SHA'."

      - name: Install OS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 clang make netcat-openbsd

      - name: Build bootable disk image
        run: make

      - name: Run host artifact tests
        run: make test

      - name: Boot smoke in GitHub Actions
        run: |
          make \
            ALLOW_LOCAL_VM=1 \
            SMOKE_QEMU_TIMEOUT=130 \
            SMOKE_INPUT_SCRIPT="generated-wad:wait-status=abiprobe:OK:90:1" \
            SMOKE_SKIP_ASSERTIONS=1 \
            smoke

      - name: Assert generated-WAD VM/process exec gates
        run: |
          cc -std=c99 -Wall -Wextra -Werror -O2 \
            tools/vibe_status_check.c -o build/vibe_status_check
          build/vibe_status_check \
            --require-exec \
            build/status.txt

      - name: Assert generated-WAD storage/VFS cloud proof
        run: |
          grep -q "vfsops=" build/status.txt
          perl -ne '$ok = 1 if /vfsops=([0-9A-F]{8})/ && hex($1) > 0; END { exit($ok ? 0 : 1) }' build/status.txt
          printf '{ "result": "ok", "gate": "guest-status", "claim": "generic VFS syscalls were exercised" }\n' > build/storage-vfs-proof.json

      - name: Run opt-in shutdown/panic proof modes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.shutdown_panic_proof }}
        timeout-minutes: 8
        run: |
          set -euo pipefail

          run_phase() {
            phase="$1"
            define="$2"
            status_name="$3"
            mode="${4:-status-before-cleanup}"
            dir="build/proof-${phase}"
            proof_dir="build/shutdown-panic-proof"
            expect_guest_exit=0
            no_reboot=1
            no_shutdown=1

            if [ "$mode" = "status-before-reset" ]; then
              expect_guest_exit=1
              no_shutdown=0
            elif [ "$mode" = "status-before-poweroff" ]; then
              expect_guest_exit=1
              no_shutdown=0
            fi

            mkdir -p "$proof_dir"
            make \
              BUILD_DIR="$dir" \
              KERNEL_EXTRA_NASMFLAGS="-D ${define}" \
              ALLOW_LOCAL_VM=1 \
              SMOKE_SKIP_ASSERTIONS=1 \
              SMOKE_CAPTURE_GFX=0 \
              SMOKE_EXPECT_GUEST_EXIT="$expect_guest_exit" \
              SMOKE_NO_REBOOT="$no_reboot" \
              SMOKE_NO_SHUTDOWN="$no_shutdown" \
              SMOKE_QEMU_TIMEOUT=60 \
              SMOKE_EARLY_SECONDS=1 \
              SMOKE_SETTLE_SECONDS=3 \
              SMOKE_SHUTDOWN_TIMEOUT=35 \
              smoke
            cp "$dir/status.txt" "${proof_dir}/${status_name}"
          }

          run_phase panic SHUTDOWN_PANIC_PROOF_PANIC status.panic.txt
          run_phase shutdown-halt SHUTDOWN_PANIC_PROOF_HALT status.shutdown-halt.txt
          run_phase shutdown-reboot SHUTDOWN_PANIC_PROOF_REBOOT status.shutdown-reboot.txt status-before-reset
          run_phase shutdown-poweroff SHUTDOWN_PANIC_PROOF_POWEROFF status.shutdown-poweroff.txt status-before-poweroff

          cat > build/shutdown-panic-proof/shutdown-panic-proof.json <<JSON
          {
            "schema": "shutdown-panic-proof-v1",
            "source": "github-actions-disposable-vm",
            "no_local_qemu": true,
            "artifact_policy": {
              "contains_wad_data": false,
              "contains_disk_image": false,
              "contains_pixel_dump": false,
              "contains_raw_audio": false
            }
          }
          JSON

          grep -q "panic=KEXC" build/shutdown-panic-proof/status.panic.txt
          grep -q "shutdown=HALT" build/shutdown-panic-proof/status.shutdown-halt.txt
          grep -q "shutdown=REBOOT" build/shutdown-panic-proof/status.shutdown-reboot.txt
          grep -q "shutdown=POWEROFF" build/shutdown-panic-proof/status.shutdown-poweroff.txt

      - name: Write cloud proof run identity
        if: always()
        run: |
          mkdir -p build
          cat > build/cloud-proof-run.json <<JSON
          {
            "schema": "cloud-proof-run-v1",
            "workflow": "os-smoke.yml",
            "artifact": "aurora-os-smoke-proof-status",
            "ref": "${GITHUB_REF_NAME:-}",
            "sha": "${GITHUB_SHA:-}",
            "run_id": "${GITHUB_RUN_ID:-}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT:-}",
            "runner": "github-actions-ubuntu",
            "local_qemu_required": false,
            "artifact_policy": {
              "status_only": true,
              "contains_wad_data": false,
              "contains_disk_image": false,
              "contains_screenshots": false,
              "contains_pixels": false,
              "contains_raw_audio": false
            }
          }
          JSON

      - name: Upload status-only proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-os-smoke-proof-status
          if-no-files-found: ignore
          path: |
            build/cloud-proof-run.json
            build/storage-vfs-proof.json
            build/status*.txt
            build/shutdown-panic-proof/**/*.json
            build/shutdown-panic-proof/**/*.txt
