name: OS smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Build and boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 clang make netcat-openbsd

      - name: Build bootable disk image
        run: make

      - name: Run host artifact tests
        run: make test

      - name: Boot smoke in GitHub Actions
        run: make ALLOW_LOCAL_VM=1 smoke

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-os-smoke-status
          if-no-files-found: ignore
          path: |
            build/kernel.elf
            build/user_probe.elf
            build/doom.elf
            build/doom.symbols
            build/status*.bin
            build/status*.txt
            build/*.log
            build/vga.txt
