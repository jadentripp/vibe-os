name: Real WAD soak

on:
  workflow_dispatch:
    inputs:
      attempts:
        description: Number of real-WAD cloud proof attempts to run in this soak.
        required: false
        type: string
        default: "3"
      min_passes:
        description: Required passing attempts. Empty means every requested attempt must pass.
        required: false
        type: string
      wad_url:
        description: Optional URL to a DOOM1.WAD, DOOM1.WAD.gz, or zip containing DOOM1.WAD. Empty uses REAL_DOOM_WAD_URL, then the public Archive.org shareware fallback.
        required: false
        type: string
      audible_audio_proof:
        description: Also require each attempt to reduce temporary QEMU WAV output to aggregate audio-proof metadata before deleting the WAV.
        required: false
        type: boolean
        default: false
      expected_ref:
        description: Optional branch/ref guard. Set this to the branch you meant to soak; the job fails before fetching the WAD if the selected workflow ref differs.
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  soak:
    name: Repeat real-WAD cloud proof
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      INPUT_DOOM_WAD_URL: ${{ inputs.wad_url }}
      INPUT_SOAK_ATTEMPTS: ${{ inputs.attempts }}
      INPUT_SOAK_MIN_PASSES: ${{ inputs.min_passes }}
      AUDIBLE_AUDIO_PROOF: ${{ inputs.audible_audio_proof }}
      INPUT_EXPECTED_REF: ${{ inputs.expected_ref }}
      REAL_DOOM_WAD_URL: ${{ secrets.REAL_DOOM_WAD_URL }}
      PUBLIC_SHAREWARE_WAD_GZ_URL: https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz
      EXPECTED_WAD_SHA1: 5b2e249b9c5133ec987b3ea77596381dc0d6bc1d
      EXPECTED_WAD_BYTES: "4196020"
      WAD_PATH: /tmp/DOOM1.WAD

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Confirm selected proof ref
        run: |
          set -euo pipefail

          if [ -n "${INPUT_EXPECTED_REF:-}" ] && [ "$GITHUB_REF_NAME" != "$INPUT_EXPECTED_REF" ]; then
            echo "expected_ref '$INPUT_EXPECTED_REF' does not match selected workflow ref '$GITHUB_REF_NAME'." >&2
            echo "Use the Run workflow branch selector or gh workflow run real-wad-soak.yml --ref '$INPUT_EXPECTED_REF'." >&2
            exit 1
          fi

          echo "Running real-WAD soak proof on ref '$GITHUB_REF_NAME' at commit '$GITHUB_SHA'."

      - name: Install OS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 clang make netcat-openbsd curl unzip

      - name: Normalize soak inputs
        run: |
          set -euo pipefail

          attempts="${INPUT_SOAK_ATTEMPTS:-3}"
          min_passes="${INPUT_SOAK_MIN_PASSES:-}"
          if ! [[ "$attempts" =~ ^[1-9][0-9]*$ ]]; then
            echo "attempts must be a positive integer" >&2
            exit 1
          fi
          if [ "$attempts" -gt 20 ]; then
            echo "attempts is capped at 20 for a manual soak" >&2
            exit 1
          fi
          if [ -z "$min_passes" ]; then
            min_passes="$attempts"
          fi
          if ! [[ "$min_passes" =~ ^[1-9][0-9]*$ ]]; then
            echo "min_passes must be a positive integer" >&2
            exit 1
          fi
          if [ "$min_passes" -gt "$attempts" ]; then
            echo "min_passes cannot exceed attempts" >&2
            exit 1
          fi

          echo "SOAK_ATTEMPTS=$attempts" >> "$GITHUB_ENV"
          echo "SOAK_MIN_PASSES=$min_passes" >> "$GITHUB_ENV"
          echo "SOAK_DIR=$RUNNER_TEMP/real-wad-soak" >> "$GITHUB_ENV"

      - name: Summarize soak proof lane
        run: |
          set -euo pipefail

          lane="gameplay"
          if [ "${AUDIBLE_AUDIO_PROOF}" = "true" ]; then
            lane="audio"
          fi

          echo "Soak lane: $lane"
          echo "Attempts: $SOAK_ATTEMPTS"
          echo "Required passes: $SOAK_MIN_PASSES"
          echo "Artifact policy: upload JSON soak metadata only; no WADs, disk images, rendered pixels, raw audio, logs, or raw status text."
          echo "Download command after completion:"
          echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name real-wad-soak-metadata --dir build/cloud-soak-$GITHUB_RUN_ID"

          {
            echo "### Real WAD soak"
            echo ""
            echo "- lane: \`$lane\`"
            echo "- attempts: \`$SOAK_ATTEMPTS\`"
            echo "- required passes: \`$SOAK_MIN_PASSES\`"
            echo "- ref: \`$GITHUB_REF_NAME\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- artifact: \`real-wad-soak-metadata\`"
            echo "- local VM: refused by runbook; this job runs on a disposable GitHub-hosted runner"
            echo "- artifact policy: JSON soak metadata only; no WADs, disk images, rendered pixels, raw audio, logs, or raw status text"
            echo ""
            echo "Validate the downloaded metadata locally:"
            echo ""
            echo "\`\`\`sh"
            echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name real-wad-soak-metadata --dir build/cloud-soak-$GITHUB_RUN_ID"
            echo "grep -R '\"conclusion\": \"success\"' build/cloud-soak-$GITHUB_RUN_ID"
            echo "\`\`\`"
            echo ""
            echo "For failed attempts that need status triage, dispatch a single-run gameplay or audio lane and download \`real-wad-smoke-proof-status\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch and validate shareware WAD
        run: |
          set -euo pipefail

          url="${INPUT_DOOM_WAD_URL:-}"
          source_label="workflow input"
          if [ -z "$url" ]; then
            url="${REAL_DOOM_WAD_URL:-}"
            source_label="REAL_DOOM_WAD_URL secret"
          fi
          if [ -z "$url" ]; then
            url="$PUBLIC_SHAREWARE_WAD_GZ_URL"
            source_label="public Archive.org shareware fallback"
          fi

          echo "Fetching DOOM1.WAD source from ${source_label}."
          curl --fail --silent --show-error --location "$url" --output "$RUNNER_TEMP/wad-source"
          magic4="$(od -An -N4 -tx1 "$RUNNER_TEMP/wad-source" | tr -d ' \n')"
          magic2="$(od -An -N2 -tx1 "$RUNNER_TEMP/wad-source" | tr -d ' \n')"
          if [ "$magic2" = "1f8b" ]; then
            gzip -cd "$RUNNER_TEMP/wad-source" > "$WAD_PATH"
          elif [ "$magic4" = "504b0304" ]; then
            wad_member="$(zipinfo -1 "$RUNNER_TEMP/wad-source" | awk 'toupper($0) ~ /(^|\/)DOOM1[.]WAD$/ { print; exit }')"
            test -n "$wad_member"
            unzip -p "$RUNNER_TEMP/wad-source" "$wad_member" > "$WAD_PATH"
          elif [ "$magic4" = "49574144" ] || [ "$magic4" = "50574144" ]; then
            cp "$RUNNER_TEMP/wad-source" "$WAD_PATH"
          else
            echo "downloaded file is not a WAD, gzip-compressed WAD, or zip containing DOOM1.WAD" >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/wad-source"

          test "$(dd if="$WAD_PATH" bs=4 count=1 2>/dev/null)" = "IWAD"
          actual_size="$(wc -c < "$WAD_PATH" | tr -d ' ')"
          actual_sha1="$(sha1sum "$WAD_PATH" | awk '{ print $1 }')"
          test "$actual_size" = "$EXPECTED_WAD_BYTES"
          test "$actual_sha1" = "$EXPECTED_WAD_SHA1"
          echo "Validated shareware DOOM1.WAD: ${actual_size} bytes, SHA-1 ${actual_sha1}"

      - name: Run repeated proof attempts
        id: repeated_attempts
        run: |
          set -euo pipefail
          mkdir -p "$SOAK_DIR"

          write_failed_attempt() {
            local output="$1"
            local attempt="$2"
            local stage="$3"
            local audible_gate="not-requested"
            if [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
              audible_gate="fail"
            fi
            cat > "$output" <<JSON
          {
            "schema": "real-wad-soak-attempt-v1",
            "source": "real-wad-cloud-proof-attempt",
            "attempt_index": $attempt,
            "conclusion": "failure",
            "failure_stage": "$stage",
            "run": {
              "workflow": "real-wad-soak.yml",
              "run_id": "$GITHUB_RUN_ID",
              "run_attempt": "$GITHUB_RUN_ATTEMPT",
              "commit": "$GITHUB_SHA"
            },
            "artifact_policy": {
              "aggregate_status_json_only": true,
              "contains_wad_data": false,
              "contains_disk_image": false,
              "contains_pixels": false,
              "contains_raw_audio": false,
              "contains_raw_status_text": false,
              "contains_qemu_logs": false,
              "upload_only_json": true
            },
            "gates": {
              "real_wad_proof": "fail",
              "scripted_human_playability": "fail",
              "scripted_gameplay_transition": "fail",
              "playability": "fail",
              "input_state_changes": "fail",
              "sb16_continuity": "fail",
              "storage_vfs": "fail",
              "audible_aggregate_proof": "$audible_gate"
            },
            "status_cadence": {
              "available": false,
              "verdict": "attempt-failed-before-cadence",
              "failure_stage": "$stage",
              "source": "gameplay-proof.json"
            }
          }
          JSON
          }

          for attempt in $(seq 1 "$SOAK_ATTEMPTS"); do
            echo "::group::real-WAD proof attempt ${attempt}/${SOAK_ATTEMPTS}"
            attempt_json="$SOAK_DIR/attempt-$(printf '%03d' "$attempt").json"
            failure_stage=""
            audio_backend="-audiodev none,id=snd0 -device sb16,audiodev=snd0"
            if [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
              audio_backend="-audiodev wav,id=snd0,path=build/doom-audio.wav -device sb16,audiodev=snd0"
            fi

            set +e
            make clean
            rc=$?
            if [ "$rc" -ne 0 ]; then failure_stage="make-clean"; fi

            if [ -z "$failure_stage" ]; then
              make DOOM_WAD="$WAD_PATH"
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="build-real-wad-image"; fi
            fi

            if [ -z "$failure_stage" ]; then
              make \
                DOOM_WAD="$WAD_PATH" \
                ALLOW_LOCAL_VM=1 \
                QEMU_EXTRA_ARGS="$audio_backend" \
                SMOKE_EXPECT_PROBE_GFX=0 \
                SMOKE_CAPTURE_GFX=0 \
                SMOKE_QEMU_TIMEOUT=120 \
                SMOKE_EARLY_SECONDS=2 \
                SMOKE_SETTLE_SECONDS=20 \
                SMOKE_SKIP_ASSERTIONS=1 \
                SMOKE_INPUT_SCRIPT="after-start:wait=2,snapshot after-fire:hold=ctrl:800,wait-status-min=pflags:000000C5:80:2,wait=1,snapshot after-move:hold=up:1200,wait-status-min=pdelta:00000001:80:2,wait=1,snapshot after-use:hold=spc:3000,snapshot,wait=2 after-mouse:mousebtn=1,wait=1,mouse=4:0,wait=1,mousebtn=0,wait=1,mouse=64:0,wait-status-min=pangledelta:00000001:80:2,wait=30,snapshot after-menu:esc,wait=2,snapshot" \
                smoke
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="cloud-smoke"; fi
            fi

            if [ -z "$failure_stage" ] && [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
              echo "audible_audio_proof still depends on retired WAV analysis; refusing until a minimal shell/C checker exists." >&2
              rc=1
              rm -f build/doom-audio.wav
              if [ "$rc" -ne 0 ]; then failure_stage="audible-audio-proof"; fi
            else
              rm -f build/doom-audio.wav
            fi

            if [ -z "$failure_stage" ]; then
              grep -q "path=DOOM.ELF" build/status.txt
              grep -q "doomopen=OK" build/status.txt
              grep -q "doomread=OK" build/status.txt
              grep -q "gameplay=OK" build/status.txt
              perl -ne '$ok = 1 if /gmap=([0-9A-F]{8})/ && hex($1) == 0x00000101; END { exit($ok ? 0 : 1) }' build/status.txt
              perl -ne '$ok = 1 if /doomframe=([0-9A-F]{8})/ && hex($1) > 0; END { exit($ok ? 0 : 1) }' build/status.txt
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="real-wad-proof"; fi
            fi

            if [ -z "$failure_stage" ]; then
              test -s build/status.after-start.txt
              test -s build/status.after-fire.txt
              test -s build/status.after-move.txt
              test -s build/status.after-use.txt
              test -s build/status.after-mouse.txt
              test -s build/status.after-menu.txt
              test -s build/status.after-fire.wait-pflags.txt
              test -s build/status.after-move.wait-pdelta.txt
              test -s build/status.after-mouse.wait-pangledelta.txt
              perl -ne '$ok = 1 if /pflags=([0-9A-F]{8})/ && (hex($1) & 0x00000004) != 0; END { exit($ok ? 0 : 1) }' build/status.after-fire.wait-pflags.txt
              perl -ne '$ok = 1 if /pdelta=([0-9A-F]{8})/ && hex($1) != 0; END { exit($ok ? 0 : 1) }' build/status.after-move.wait-pdelta.txt
              perl -ne '$ok = 1 if /pangledelta=([0-9A-F]{8})/ && hex($1) != 0; END { exit($ok ? 0 : 1) }' build/status.after-mouse.wait-pangledelta.txt
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="scripted-human-playability"; fi
            fi

            if [ -z "$failure_stage" ]; then
              grep -q "gameplay=OK" build/status.txt
              perl -ne '$ok = 1 if /leveltime=([0-9A-F]{8})/ && hex($1) > 0; END { exit($ok ? 0 : 1) }' build/status.txt
              printf '{ "result": "ok", "gate": "guest-status", "claim": "scripted input changed gameplay state" }\n' > build/gameplay-proof.json
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="scripted-gameplay-transition"; fi
            fi

            if [ -z "$failure_stage" ]; then
              cc -std=c99 -Wall -Wextra -Werror -O2 \
                tools/vibe_status_check.c -o build/vibe_status_check
              build/vibe_status_check \
                --require-exec \
                --require-preempt \
                build/status.txt
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="vm-status-proof"; fi
            fi

            if [ -z "$failure_stage" ]; then
              grep -q "vfsops=" build/status.txt
              perl -ne '$ok = 1 if /vfsops=([0-9A-F]{8})/ && hex($1) > 0; END { exit($ok ? 0 : 1) }' build/status.txt
              printf '{ "result": "ok", "gate": "guest-status", "claim": "generic VFS syscalls were exercised" }\n' > build/storage-vfs-proof.json
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="storage-vfs-proof"; fi
            fi

            if [ -z "$failure_stage" ]; then
              grep -q "audio=SB16" build/status.txt
              perl -ne '$ok = 1 if /sfxbytes=([0-9A-F]{8})/ && hex($1) > 0; END { exit($ok ? 0 : 1) }' build/status.txt
              perl -ne '$ok = 1 if /musicpull=([0-9A-F]{8})/ && hex($1) > 0; END { exit($ok ? 0 : 1) }' build/status.txt
              perl -ne '$ok = 1 if /pcmwrite=([0-9A-F]{8})/ && hex($1) > 0; END { exit($ok ? 0 : 1) }' build/status.txt
              printf '{ "result": "ok", "gate": "guest-status", "claim": "SB16 PCM path made progress" }\n' > build/audio-proof.json
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="sb16-continuity"; fi
            fi

            if [ -z "$failure_stage" ] && [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
              echo "audible_audio_proof has no accepted shell/C checker yet." >&2
              rc=1
              if [ "$rc" -ne 0 ]; then failure_stage="audible-audio-manifest"; fi
            fi

            if [ -z "$failure_stage" ]; then
              proof_dir="$RUNNER_TEMP/real-wad-soak-proof-$attempt"
              rm -rf "$proof_dir"
              mkdir -p "$proof_dir"
              cp build/status*.txt "$proof_dir"/
              cp build/gameplay-proof.json "$proof_dir"/
              cp build/storage-vfs-proof.json "$proof_dir"/
              if [ -f build/audio-proof.json ]; then
                cp build/audio-proof.json "$proof_dir"/
              fi
              extra_args=(--require-gameplay-proof)
              if [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
                extra_args+=(--require-audible-proof)
              fi
              test -s "$proof_dir/status.txt"
              test -s "$proof_dir/gameplay-proof.json"
              test -s "$proof_dir/storage-vfs-proof.json"
              grep -q '"result": "ok"' "$proof_dir/gameplay-proof.json"
              grep -q '"result": "ok"' "$proof_dir/storage-vfs-proof.json"
              if [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
                test -s "$proof_dir/audio-proof.json"
                grep -q '"machine_audible": true' "$proof_dir/audio-proof.json"
              fi
              rc=$?
              if [ "$rc" -eq 0 ]; then
                audible_gate="not-requested"
                if [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
                  audible_gate="pass"
                fi
                cat > "$attempt_json" <<JSON
          {
            "schema": "real-wad-soak-attempt-v1",
            "source": "real-wad-cloud-proof-attempt",
            "attempt_index": $attempt,
            "conclusion": "success",
            "failure_stage": "",
            "run": {
              "workflow": "real-wad-soak.yml",
              "run_id": "$GITHUB_RUN_ID",
              "run_attempt": "$GITHUB_RUN_ATTEMPT",
              "commit": "$GITHUB_SHA"
            },
            "artifact_policy": {
              "aggregate_status_json_only": true,
              "contains_wad_data": false,
              "contains_disk_image": false,
              "contains_pixels": false,
              "contains_raw_audio": false,
              "contains_raw_status_text": false,
              "contains_qemu_logs": false,
              "upload_only_json": true
            },
            "gates": {
              "real_wad_proof": "pass",
              "scripted_human_playability": "pass",
              "scripted_gameplay_transition": "pass",
              "playability": "pass",
              "input_state_changes": "pass",
              "sb16_continuity": "pass",
              "storage_vfs": "pass",
              "audible_aggregate_proof": "$audible_gate"
            },
            "status_cadence": {
              "available": true,
              "source": "gameplay-proof.json",
              "verdict": "validated-by-guest-status"
            }
          }
          JSON
              fi
              if [ "$rc" -ne 0 ]; then failure_stage="soak-attempt-metadata"; fi
            fi

            set -e
            if [ -n "$failure_stage" ]; then
              write_failed_attempt "$attempt_json" "$attempt" "$failure_stage"
            fi

            rm -rf build
            echo "::endgroup::"
          done

      - name: Aggregate soak metadata and enforce pass threshold
        id: aggregate_soak
        if: always()
        run: |
          set -euo pipefail
          total="$(find "$SOAK_DIR" -maxdepth 1 -name 'attempt-*.json' | wc -l | tr -d ' ')"
          passes="$(grep -l '"conclusion": "success"' "$SOAK_DIR"/attempt-*.json 2>/dev/null | wc -l | tr -d ' ')"
          failures=$((total - passes))
          cat > "$SOAK_DIR/real-wad-soak-summary.json" <<JSON
          {
            "schema": "real-wad-soak-summary-v1",
            "source": "real-wad-soak.yml",
            "run": {
              "workflow": "real-wad-soak.yml",
              "run_id": "$GITHUB_RUN_ID",
              "run_attempt": "$GITHUB_RUN_ATTEMPT",
              "commit": "$GITHUB_SHA"
            },
            "attempts_requested": $SOAK_ATTEMPTS,
            "attempts_recorded": $total,
            "required_passes": $SOAK_MIN_PASSES,
            "passes": $passes,
            "failures": $failures,
            "audible_audio_proof": "$AUDIBLE_AUDIO_PROOF",
            "artifact_policy": {
              "aggregate_status_json_only": true,
              "contains_wad_data": false,
              "contains_disk_image": false,
              "contains_pixels": false,
              "contains_raw_audio": false,
              "contains_raw_status_text": false,
              "contains_qemu_logs": false,
              "upload_only_json": true
            }
          }
          JSON
          test "$total" = "$SOAK_ATTEMPTS"
          test "$passes" -ge "$SOAK_MIN_PASSES"

      - name: Delete remote-only WAD
        if: always()
        run: |
          rm -f "$WAD_PATH"

      - name: Upload aggregate soak metadata
        id: upload_soak_metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-wad-soak-metadata
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/real-wad-soak/*.json

      - name: Summarize soak lane outcomes and reruns
        if: always()
        env:
          ATTEMPTS_OUTCOME: ${{ steps.repeated_attempts.outcome }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate_soak.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_soak_metadata.outcome }}
        run: |
          set -euo pipefail

          if [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
            lane="audio"
          else
            lane="gameplay"
          fi
          soak_attempts="${SOAK_ATTEMPTS:-${INPUT_SOAK_ATTEMPTS:-3}}"
          soak_min_passes="${SOAK_MIN_PASSES:-${INPUT_SOAK_MIN_PASSES:-$soak_attempts}}"

          lane_state="green"
          for outcome in "$ATTEMPTS_OUTCOME" "$AGGREGATE_OUTCOME"; do
            case "$outcome" in
              success|skipped) ;;
              *) lane_state="red" ;;
            esac
          done

          {
            echo "### Real WAD soak lane outcomes"
            echo ""
            echo "| Lane | State | Checks |"
            echo "| --- | --- | --- |"
            echo "| $lane soak | $lane_state | attempts=$ATTEMPTS_OUTCOME, aggregate=$AGGREGATE_OUTCOME |"
            echo "| persistence/save-load | not-requested | real-wad-soak.yml intentionally excludes persistence |"
            echo "| artifact upload | $UPLOAD_OUTCOME | JSON metadata only |"
            echo ""
            echo "Artifact policy: JSON soak metadata only; no WADs, disk images, rendered pixels, raw audio, logs, or raw status text are uploaded."
            echo ""
            echo "#### Rerun only the red lane"
            if [ "$lane_state" = "red" ]; then
              echo ""
              echo '```sh'
              echo "gh workflow run real-wad-soak.yml --repo \"$GITHUB_REPOSITORY\" --ref \"$GITHUB_REF_NAME\" -f expected_ref=\"$GITHUB_REF_NAME\" -f lane=\"$lane\" -f attempts=\"$soak_attempts\" -f min_passes=\"$soak_min_passes\""
              echo "gh workflow run real-wad-smoke.yml --repo \"$GITHUB_REPOSITORY\" --ref \"$GITHUB_REF_NAME\" -f expected_ref=\"$GITHUB_REF_NAME\""
              echo '```'
              echo ""
              echo "Use the single-run command when a failed soak attempt needs status-level triage."
            else
              echo "No red soak lane was detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
