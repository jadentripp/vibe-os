name: Real WAD soak

on:
  workflow_dispatch:
    inputs:
      attempts:
        description: Number of real-WAD cloud proof attempts to run in this soak.
        required: false
        type: string
        default: "3"
      min_passes:
        description: Required passing attempts. Empty means every requested attempt must pass.
        required: false
        type: string
      wad_url:
        description: Optional URL to a DOOM1.WAD, DOOM1.WAD.gz, or zip containing DOOM1.WAD. Empty uses REAL_DOOM_WAD_URL, then the public Archive.org shareware fallback.
        required: false
        type: string
      audible_audio_proof:
        description: Also require each attempt to reduce temporary QEMU WAV output to aggregate audio-proof metadata before deleting the WAV.
        required: false
        type: boolean
        default: false
      expected_ref:
        description: Optional branch/ref guard. Set this to the branch you meant to soak; the job fails before fetching the WAD if the selected workflow ref differs.
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  soak:
    name: Repeat real-WAD cloud proof
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      INPUT_DOOM_WAD_URL: ${{ inputs.wad_url }}
      INPUT_SOAK_ATTEMPTS: ${{ inputs.attempts }}
      INPUT_SOAK_MIN_PASSES: ${{ inputs.min_passes }}
      AUDIBLE_AUDIO_PROOF: ${{ inputs.audible_audio_proof }}
      INPUT_EXPECTED_REF: ${{ inputs.expected_ref }}
      REAL_DOOM_WAD_URL: ${{ secrets.REAL_DOOM_WAD_URL }}
      PUBLIC_SHAREWARE_WAD_GZ_URL: https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz
      WAD_PATH: /tmp/DOOM1.WAD

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Confirm selected proof ref
        run: |
          set -euo pipefail

          if [ -n "${INPUT_EXPECTED_REF:-}" ] && [ "$GITHUB_REF_NAME" != "$INPUT_EXPECTED_REF" ]; then
            echo "expected_ref '$INPUT_EXPECTED_REF' does not match selected workflow ref '$GITHUB_REF_NAME'." >&2
            echo "Use the Run workflow branch selector or gh workflow run real-wad-soak.yml --ref '$INPUT_EXPECTED_REF'." >&2
            exit 1
          fi

          echo "Running real-WAD soak proof on ref '$GITHUB_REF_NAME' at commit '$GITHUB_SHA'."

      - name: Install OS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 clang make netcat-openbsd curl

      - name: Normalize soak inputs
        run: |
          set -euo pipefail

          attempts="${INPUT_SOAK_ATTEMPTS:-3}"
          min_passes="${INPUT_SOAK_MIN_PASSES:-}"
          if ! [[ "$attempts" =~ ^[1-9][0-9]*$ ]]; then
            echo "attempts must be a positive integer" >&2
            exit 1
          fi
          if [ "$attempts" -gt 20 ]; then
            echo "attempts is capped at 20 for a manual soak" >&2
            exit 1
          fi
          if [ -z "$min_passes" ]; then
            min_passes="$attempts"
          fi
          if ! [[ "$min_passes" =~ ^[1-9][0-9]*$ ]]; then
            echo "min_passes must be a positive integer" >&2
            exit 1
          fi
          if [ "$min_passes" -gt "$attempts" ]; then
            echo "min_passes cannot exceed attempts" >&2
            exit 1
          fi

          echo "SOAK_ATTEMPTS=$attempts" >> "$GITHUB_ENV"
          echo "SOAK_MIN_PASSES=$min_passes" >> "$GITHUB_ENV"
          echo "SOAK_DIR=$RUNNER_TEMP/real-wad-soak" >> "$GITHUB_ENV"

      - name: Summarize soak proof lane
        run: |
          set -euo pipefail

          lane="gameplay"
          if [ "${AUDIBLE_AUDIO_PROOF}" = "true" ]; then
            lane="audio"
          fi

          echo "Soak lane: $lane"
          echo "Attempts: $SOAK_ATTEMPTS"
          echo "Required passes: $SOAK_MIN_PASSES"
          echo "Artifact policy: upload JSON soak metadata only; no WADs, disk images, rendered pixels, raw audio, logs, or raw status text."
          echo "Download command after completion:"
          echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name real-wad-soak-metadata --dir build/cloud-soak-$GITHUB_RUN_ID"

          {
            echo "### Real WAD soak"
            echo ""
            echo "- lane: \`$lane\`"
            echo "- attempts: \`$SOAK_ATTEMPTS\`"
            echo "- required passes: \`$SOAK_MIN_PASSES\`"
            echo "- ref: \`$GITHUB_REF_NAME\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- artifact: \`real-wad-soak-metadata\`"
            echo "- local VM: refused by runbook; this job runs on a disposable GitHub-hosted runner"
            echo "- artifact policy: JSON soak metadata only; no WADs, disk images, rendered pixels, raw audio, logs, or raw status text"
            echo ""
            echo "Validate the downloaded metadata locally:"
            echo ""
            echo "\`\`\`sh"
            echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name real-wad-soak-metadata --dir build/cloud-soak-$GITHUB_RUN_ID"
            echo "python3 tools/check_cloud_playability_artifacts.py --soak-summary build/cloud-soak-$GITHUB_RUN_ID"
            echo "\`\`\`"
            echo ""
            echo "For failed attempts that need raw status triage, dispatch a single-run gameplay or audio lane and download \`real-wad-smoke-status\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch and validate shareware WAD
        run: |
          set -euo pipefail

          url="${INPUT_DOOM_WAD_URL:-}"
          source_label="workflow input"
          if [ -z "$url" ]; then
            url="${REAL_DOOM_WAD_URL:-}"
            source_label="REAL_DOOM_WAD_URL secret"
          fi
          if [ -z "$url" ]; then
            url="$PUBLIC_SHAREWARE_WAD_GZ_URL"
            source_label="public Archive.org shareware fallback"
          fi

          echo "Fetching DOOM1.WAD source from ${source_label}."
          python3 tools/prepare_shareware_wad.py --url "$url" --output "$WAD_PATH"

      - name: Run repeated proof attempts
        id: repeated_attempts
        run: |
          set -euo pipefail
          mkdir -p "$SOAK_DIR"

          write_failed_attempt() {
            local output="$1"
            local attempt="$2"
            local stage="$3"
            python3 - "$output" "$attempt" "$stage" "$AUDIBLE_AUDIO_PROOF" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          attempt = int(sys.argv[2])
          stage = sys.argv[3]
          audible = sys.argv[4] == "true"
          policy = {
              "aggregate_status_json_only": True,
              "contains_wad_data": False,
              "contains_disk_image": False,
              "contains_pixels": False,
              "contains_raw_audio": False,
              "contains_raw_status_text": False,
              "contains_qemu_logs": False,
              "upload_only_json": True,
          }
          failed = {
              "schema": "real-wad-soak-attempt-v1",
              "source": "real-wad-cloud-proof-attempt",
              "attempt_index": attempt,
              "conclusion": "failure",
              "failure_stage": stage,
              "run": {
                  "workflow": "real-wad-soak.yml",
                  "run_id": os.environ.get("GITHUB_RUN_ID", ""),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
                  "commit": os.environ.get("GITHUB_SHA", ""),
              },
              "artifact_policy": policy,
              "gates": {
                  "real_wad_proof": "fail",
                  "scripted_human_playability": "fail",
                  "scripted_gameplay_transition": "fail",
                  "playability": "fail",
                  "input_state_changes": "fail",
                  "sb16_continuity": "fail",
                  "audible_aggregate_proof": "fail" if audible else "not-requested",
              },
              "status_cadence": {
                  "available": False,
                  "verdict": "attempt-failed-before-cadence",
                  "failure_stage": stage,
                  "source": "gameplay-proof.json",
              },
          }
          output.write_text(json.dumps(failed, indent=2, sort_keys=True) + "\n")
          PY
          }

          for attempt in $(seq 1 "$SOAK_ATTEMPTS"); do
            echo "::group::real-WAD proof attempt ${attempt}/${SOAK_ATTEMPTS}"
            attempt_json="$SOAK_DIR/attempt-$(printf '%03d' "$attempt").json"
            failure_stage=""
            audio_backend="-audiodev none,id=snd0 -device sb16,audiodev=snd0"
            if [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
              audio_backend="-audiodev wav,id=snd0,path=build/doom-audio.wav -device sb16,audiodev=snd0"
            fi

            set +e
            make clean
            rc=$?
            if [ "$rc" -ne 0 ]; then failure_stage="make-clean"; fi

            if [ -z "$failure_stage" ]; then
              make DOOM_WAD="$WAD_PATH"
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="build-real-wad-image"; fi
            fi

            if [ -z "$failure_stage" ]; then
              make \
                DOOM_WAD="$WAD_PATH" \
                ALLOW_LOCAL_VM=1 \
                QEMU_EXTRA_ARGS="$audio_backend" \
                SMOKE_EXPECT_PROBE_GFX=0 \
                SMOKE_CAPTURE_GFX=0 \
                SMOKE_QEMU_TIMEOUT=120 \
                SMOKE_EARLY_SECONDS=2 \
                SMOKE_SETTLE_SECONDS=20 \
                SMOKE_SKIP_ASSERTIONS=1 \
                SMOKE_INPUT_SCRIPT="after-start:wait=2,snapshot after-fire:hold=ctrl:800,wait-status-min=pflags:000000C5:80:2,wait=1,snapshot after-move:hold=up:1200,wait-status-min=pdelta:00000001:80:2,wait=1,snapshot after-use:hold=spc:3000,snapshot,wait=2 after-mouse:mousebtn=1,wait=1,mouse=4:0,wait=1,mousebtn=0,wait=1,mouse=64:0,wait-status-min=pangledelta:00000001:80:2,wait=30,snapshot after-menu:esc,wait=2,snapshot" \
                smoke
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="cloud-smoke"; fi
            fi

            if [ -z "$failure_stage" ] && [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
              python3 tools/check_audible_audio_proof.py \
                --analyze-wav build/doom-audio.wav \
                --status build/status.txt \
                --baseline build/status.after-start.txt \
                --fire build/status.after-fire.txt \
                --movement build/status.after-move.txt \
                --use build/status.after-use.txt \
                --menu build/status.after-menu.txt \
                --output build/audio-proof.json
              rc=$?
              rm -f build/doom-audio.wav
              if [ "$rc" -ne 0 ]; then failure_stage="audible-audio-proof"; fi
            else
              rm -f build/doom-audio.wav
            fi

            if [ -z "$failure_stage" ]; then
              python3 tools/check_real_wad_proof.py \
                --baseline build/status.after-start.txt \
                --start build/status.after-start.txt \
                --fire build/status.after-fire.txt \
                --movement build/status.after-move.txt \
                --use build/status.after-use.txt \
                --mouse build/status.after-mouse.txt \
                --menu build/status.after-menu.txt \
                build/status.txt
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="real-wad-proof"; fi
            fi

            if [ -z "$failure_stage" ]; then
              python3 tools/check_human_playability_proof.py \
                --baseline build/status.after-start.txt \
                --start build/status.after-start.txt \
                --fire build/status.after-fire.txt \
                --movement build/status.after-move.txt \
                --use build/status.after-use.txt \
                --mouse build/status.after-mouse.txt \
                --menu build/status.after-menu.txt \
                build/status.txt
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="scripted-human-playability"; fi
            fi

            if [ -z "$failure_stage" ]; then
              python3 tools/check_scripted_gameplay_proof.py \
                --start build/status.after-start.txt \
                --fire build/status.after-fire.txt \
                --movement build/status.after-move.txt \
                --use build/status.after-use.txt \
                --mouse build/status.after-mouse.txt \
                --menu build/status.after-menu.txt \
                --write-json build/gameplay-proof.json \
                --require-long-run-cadence \
                build/status.txt
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="scripted-gameplay-transition"; fi
            fi

            if [ -z "$failure_stage" ]; then
              python3 tools/check_vm_status_proof.py \
                --require-exec \
                --require-preempt \
                build/status.txt
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="vm-status-proof"; fi
            fi

            if [ -z "$failure_stage" ]; then
              python3 tools/check_audio_continuity_proof.py \
                --require-pull-stream \
                --baseline build/status.after-start.txt \
                --fire build/status.after-fire.txt \
                --movement build/status.after-move.txt \
                --use build/status.after-use.txt \
                --menu build/status.after-menu.txt \
                build/status.txt
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="sb16-continuity"; fi
            fi

            if [ -z "$failure_stage" ] && [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
              python3 tools/check_audible_audio_proof.py build/audio-proof.json
              rc=$?
              if [ "$rc" -ne 0 ]; then failure_stage="audible-audio-manifest"; fi
            fi

            if [ -z "$failure_stage" ]; then
              proof_dir="$RUNNER_TEMP/real-wad-soak-proof-$attempt"
              rm -rf "$proof_dir"
              mkdir -p "$proof_dir"
              cp build/kernel.elf build/user_probe.elf build/doom.elf build/doom.symbols "$proof_dir"/
              cp build/status*.txt build/status*.bin "$proof_dir"/
              cp build/*.log "$proof_dir"/ 2>/dev/null || true
              cp build/gameplay-proof.json "$proof_dir"/
              if [ -f build/audio-proof.json ]; then
                cp build/audio-proof.json "$proof_dir"/
              fi
              extra_args=(--require-gameplay-proof)
              if [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
                extra_args+=(--require-audible-proof)
              fi
              python3 tools/check_cloud_playability_artifacts.py \
                "$proof_dir" \
                --write-soak-attempt "$attempt_json" \
                --soak-attempt-index "$attempt" \
                "${extra_args[@]}"
              rc=$?
              if [ "$rc" -eq 0 ]; then
                python3 - "$attempt_json" build/gameplay-proof.json <<'PY'
          import json
          import sys
          from pathlib import Path

          attempt_path = Path(sys.argv[1])
          gameplay_path = Path(sys.argv[2])
          attempt = json.loads(attempt_path.read_text())
          gameplay = json.loads(gameplay_path.read_text())
          diagnostics = gameplay.get("performance_diagnostics", {})
          cadence = diagnostics.get("long_run_cadence", {})
          attempt["status_cadence"] = {
              "available": True,
              "source": "gameplay-proof.json",
              "schema": gameplay.get("schema", ""),
              "verdict": cadence.get("verdict", ""),
              "interpretation": cadence.get("interpretation", ""),
              "minimum_play_window_doom_tics": cadence.get("minimum_play_window_doom_tics", ""),
              "status_fields": cadence.get("status_fields", []),
              "play_window": cadence.get("play_window", {}),
              "session_window": cadence.get("session_window", {}),
              "menu_tail_window": cadence.get("menu_tail_window", {}),
          }
          attempt_path.write_text(json.dumps(attempt, indent=2, sort_keys=True) + "\n")
          PY
                rc=$?
              fi
              if [ "$rc" -ne 0 ]; then failure_stage="soak-attempt-metadata"; fi
            fi

            set -e
            if [ -n "$failure_stage" ]; then
              write_failed_attempt "$attempt_json" "$attempt" "$failure_stage"
            fi

            rm -rf build
            echo "::endgroup::"
          done

      - name: Aggregate soak metadata and enforce pass threshold
        id: aggregate_soak
        if: always()
        run: |
          set -euo pipefail
          extra_args=()
          if [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
            extra_args+=(--require-audible-proof)
          fi
          python3 tools/check_cloud_playability_artifacts.py \
            --write-soak-summary "$SOAK_DIR/real-wad-soak-summary.json" \
            --soak-attempt-dir "$SOAK_DIR" \
            --soak-attempts "$SOAK_ATTEMPTS" \
            --soak-required-passes "$SOAK_MIN_PASSES" \
            "${extra_args[@]}"
          python3 tools/check_cloud_playability_artifacts.py --soak-summary "$SOAK_DIR"

      - name: Delete remote-only WAD
        if: always()
        run: |
          rm -f "$WAD_PATH"

      - name: Upload aggregate soak metadata
        id: upload_soak_metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-wad-soak-metadata
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/real-wad-soak/*.json

      - name: Summarize soak lane outcomes and reruns
        if: always()
        env:
          ATTEMPTS_OUTCOME: ${{ steps.repeated_attempts.outcome }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate_soak.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_soak_metadata.outcome }}
        run: |
          set -euo pipefail

          if [ "$AUDIBLE_AUDIO_PROOF" = "true" ]; then
            lane="audio"
          else
            lane="gameplay"
          fi
          soak_attempts="${SOAK_ATTEMPTS:-${INPUT_SOAK_ATTEMPTS:-3}}"
          soak_min_passes="${SOAK_MIN_PASSES:-${INPUT_SOAK_MIN_PASSES:-$soak_attempts}}"

          lane_state="green"
          for outcome in "$ATTEMPTS_OUTCOME" "$AGGREGATE_OUTCOME"; do
            case "$outcome" in
              success|skipped) ;;
              *) lane_state="red" ;;
            esac
          done

          {
            echo "### Real WAD soak lane outcomes"
            echo ""
            echo "| Lane | State | Checks |"
            echo "| --- | --- | --- |"
            echo "| $lane soak | $lane_state | attempts=$ATTEMPTS_OUTCOME, aggregate=$AGGREGATE_OUTCOME |"
            echo "| persistence/save-load | not-requested | real-wad-soak.yml intentionally excludes persistence |"
            echo "| artifact upload | $UPLOAD_OUTCOME | JSON metadata only |"
            echo ""
            echo "Artifact policy: JSON soak metadata only; no WADs, disk images, rendered pixels, raw audio, logs, or raw status text are uploaded."
            echo ""
            echo "#### Rerun only the red lane"
            if [ "$lane_state" = "red" ]; then
              echo ""
              echo '```sh'
              echo "python3 tools/run_cloud_playability.py --repo \"$GITHUB_REPOSITORY\" --ref \"$GITHUB_REF_NAME\" --lane $lane --soak-attempts \"$soak_attempts\" --soak-min-passes \"$soak_min_passes\" --wait --download-artifacts cloud-soak-$lane"
              echo "python3 tools/run_cloud_playability.py --repo \"$GITHUB_REPOSITORY\" --ref \"$GITHUB_REF_NAME\" --lane $lane --wait --download-artifacts cloud-run-$lane"
              echo '```'
              echo ""
              echo "Use the single-run command when a failed soak attempt needs status-level triage."
            else
              echo "No red soak lane was detected."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
