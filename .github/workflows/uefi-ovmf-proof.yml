name: UEFI OVMF loader proof

on:
  workflow_dispatch:
    inputs:
      proof_mode:
        description: contract is QEMU-free; attempt records OVMF loader markers; prove requires the kernel-owned VIBEKERN marker.
        required: true
        type: choice
        default: contract
        options:
          - contract
          - attempt
          - prove
      expected_ref:
        description: Optional branch/ref guard. Set this to the branch you meant to prove; the job fails before toolchain install if the selected workflow ref differs.
        required: false
        type: string
      expected_sha:
        description: Optional exact commit guard. Set this to the main commit you meant to prove; the job fails before toolchain install if GITHUB_SHA differs.
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  uefi-ovmf:
    name: UEFI OVMF loader proof
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      INPUT_EXPECTED_REF: ${{ inputs.expected_ref }}
      INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Confirm selected proof ref
        run: |
          set -euo pipefail

          if [ -n "${INPUT_EXPECTED_REF:-}" ] && [ "$GITHUB_REF_NAME" != "$INPUT_EXPECTED_REF" ]; then
            echo "expected_ref '$INPUT_EXPECTED_REF' does not match selected workflow ref '$GITHUB_REF_NAME'." >&2
            echo "Use the Run workflow branch selector or gh workflow run uefi-ovmf-proof.yml --ref '$INPUT_EXPECTED_REF'." >&2
            exit 1
          fi
          if [ -n "${INPUT_EXPECTED_SHA:-}" ] && [ "$GITHUB_SHA" != "$INPUT_EXPECTED_SHA" ]; then
            echo "expected_sha '$INPUT_EXPECTED_SHA' does not match selected workflow commit '$GITHUB_SHA'." >&2
            echo "Fetch/push main first, then rerun the post-merge cloud proof lane for the exact commit." >&2
            exit 1
          fi

          echo "Running UEFI OVMF proof on ref '$GITHUB_REF_NAME' at commit '$GITHUB_SHA'."

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm clang lld make file

      - name: Install disposable OVMF runner tools
        if: ${{ inputs.proof_mode != 'contract' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf netcat-openbsd

      - name: Build kernel ELF for ESP packaging
        run: make DOOM_WAD= build/kernel.elf

      - name: Build UEFI loader PE/COFF
        run: |
          set -euo pipefail
          mkdir -p build/uefi-ovmf-proof
          make DOOM_WAD= uefi-loader-pe
          file build/uefi/BOOTX64.EFI | tee build/uefi-ovmf-proof/bootx64.file.txt
          grep -Eq 'PE32\+ executable.*EFI application.*x86-64' build/uefi-ovmf-proof/bootx64.file.txt
          cat > build/uefi-ovmf-proof/uefi-contract.json <<JSON
          {
            "schema": "uefi-proof-contract-v1",
            "mode": "${{ inputs.proof_mode }}",
            "loader_assembly_checked": true,
            "kernel_elf_built": true,
            "pe_coff_loader_built": true,
            "pe_coff_file_kind": "efi-application-x86-64",
            "legacy_host_scripts_removed": true,
            "local_qemu_required": false,
            "note": "Contract mode builds BOOTX64.EFI but does not boot OVMF. Attempt/prove mode runs only on this disposable GitHub runner."
          }
          JSON

      - name: Build dual BIOS/UEFI FAT16 image
        if: ${{ inputs.proof_mode != 'contract' }}
        run: |
          set -euo pipefail
          make DOOM_WAD= uefi-dual-image
          build/make_wad_image --inspect build/uefi/uefi-fat16.img > build/uefi-ovmf-proof/dual-image-inspect.txt
          grep -q 'root.*=DOOM1.WAD' build/uefi-ovmf-proof/dual-image-inspect.txt
          grep -q 'root.*=KERNEL.ELF' build/uefi-ovmf-proof/dual-image-inspect.txt
          grep -q 'root.*=USERPROB.ELF' build/uefi-ovmf-proof/dual-image-inspect.txt
          grep -q 'root.*=DOOM.ELF' build/uefi-ovmf-proof/dual-image-inspect.txt

          cat > build/uefi-ovmf-proof/uefi-esp.json <<JSON
          {
            "schema": "uefi-esp-artifact-v1",
            "dual_bios_uefi_image_built": true,
            "fat16_partition_built": true,
            "boot_file": "EFI/BOOT/BOOTX64.EFI",
            "kernel_file": "VIBEOS/KERNEL.ELF",
            "bios_kernel_file": "KERNEL.ELF",
            "doom_file": "DOOM.ELF",
            "wad_file": "DOOM1.WAD",
            "artifact_uploaded": false
          }
          JSON

      - name: Boot UEFI path in disposable OVMF
        if: ${{ inputs.proof_mode != 'contract' }}
        run: |
          set -euo pipefail

          ovmf_code=""
          for candidate in /usr/share/OVMF/OVMF_CODE.fd /usr/share/OVMF/OVMF_CODE_4M.fd; do
            if [ -f "$candidate" ]; then
              ovmf_code="$candidate"
              break
            fi
          done
          if [ -z "$ovmf_code" ]; then
            echo "No non-secure OVMF_CODE.fd found." >&2
            exit 1
          fi
          ovmf_vars_src=""
          for candidate in /usr/share/OVMF/OVMF_VARS.fd /usr/share/OVMF/OVMF_VARS_4M.fd; do
            if [ -f "$candidate" ]; then
              ovmf_vars_src="$candidate"
              break
            fi
          done
          if [ -z "$ovmf_vars_src" ]; then
            echo "No OVMF_VARS.fd found." >&2
            exit 1
          fi

          cp "$ovmf_vars_src" build/uefi-ovmf-proof/OVMF_VARS.fd
          monitor_sock=build/uefi-ovmf-proof/monitor.sock
          qemu_pid=""
          rm -f "$monitor_sock" build/uefi-ovmf-proof/status.bin build/uefi-ovmf-proof/status.txt build/uefi-ovmf-proof/monitor.log build/uefi-ovmf-proof/serial.log

          cleanup_qemu() {
            if [ -n "$qemu_pid" ] && kill -0 "$qemu_pid" 2>/dev/null; then
              if [ -S "$monitor_sock" ]; then
                printf 'quit\n' | nc -w 2 -U "$monitor_sock" >/dev/null 2>&1 || true
                sleep 1
              fi
              kill "$qemu_pid" 2>/dev/null || true
              wait "$qemu_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_qemu EXIT

          timeout 120s qemu-system-x86_64 \
            -machine pc,accel=tcg \
            -m 256M \
            -drive if=pflash,format=raw,readonly=on,file="$ovmf_code" \
            -drive if=pflash,format=raw,file=build/uefi-ovmf-proof/OVMF_VARS.fd \
            -drive if=ide,format=raw,file=build/uefi/uefi-fat16.img \
            -boot order=c \
            -net none \
            -display none \
            -serial file:build/uefi-ovmf-proof/serial.log \
            -monitor unix:build/uefi-ovmf-proof/monitor.sock,server,nowait \
            -no-reboot \
            -no-shutdown \
            -chardev file,id=uefi_dbg,path=build/uefi-ovmf-proof/debugcon-402.log \
            -device isa-debugcon,iobase=0x402,chardev=uefi_dbg \
            > build/uefi-ovmf-proof/qemu.log 2>&1 &
          qemu_pid=$!

          for _ in $(seq 1 45); do
            if [ -S "$monitor_sock" ]; then
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              wait "$qemu_pid" || true
              echo "QEMU exited before creating the monitor socket." >&2
              exit 1
            fi
            sleep 1
          done
          test -S "$monitor_sock"

          capture_status() {
            printf 'pmemsave 0x40000 131072 build/uefi-ovmf-proof/status.bin\n' \
              | nc -w 3 -U "$monitor_sock" >> build/uefi-ovmf-proof/monitor.log 2>&1
            test -s build/uefi-ovmf-proof/status.bin
            tr '\000' ' ' < build/uefi-ovmf-proof/status.bin > build/uefi-ovmf-proof/status.txt
          }

          status_has() {
            pattern="$1"
            [ -s build/uefi-ovmf-proof/status.txt ] && grep -aEq "$pattern" build/uefi-ovmf-proof/status.txt
          }

          status_bool() {
            pattern="$1"
            if status_has "$pattern"; then
              printf true
            else
              printf false
            fi
          }

          status_value() {
            key="$1"
            if [ ! -s build/uefi-ovmf-proof/status.txt ]; then
              printf '%s' '-'
              return 0
            fi
            value=$(tr ' ' '\n' < build/uefi-ovmf-proof/status.txt \
              | grep -aE "^${key}=" \
              | tail -1 || true)
            if [ -z "$value" ]; then
              printf '%s' '-'
              return 0
            fi
            printf '%s' "$value" | sed -E 's/^[^=]+=//; s/[^A-Za-z0-9_.:\/+-]/_/g'
          }

          write_guest_status_manifest() {
            missing_pattern="${1:-}"
            capture_status || true
            cat > build/uefi-ovmf-proof/uefi-guest-status.json <<JSON
          {
            "schema": "uefi-guest-status-v1",
            "mode": "${{ inputs.proof_mode }}",
            "guest_status_page_captured": $([ -s build/uefi-ovmf-proof/status.txt ] && echo true || echo false),
            "required_missing_pattern": "$missing_pattern",
            "uefi_ok": $(status_bool 'uefi=OK'),
            "ata_ok": $(status_bool 'ata=OK'),
            "block_partition_mbr": $(status_bool 'blkpart=MBR'),
            "wad_ok": $(status_bool 'wad=OK'),
            "doom_exec_path_seen": $(status_bool 'path=DOOM[.]ELF'),
            "doom_loaded": $(status_bool 'doom=OK'),
            "doom_run_or_exit": $(status_bool 'doomrun=(RUN|EXIT)'),
            "ata": "$(status_value ata)",
            "block_partition": "$(status_value blkpart)",
            "block_status": "$(status_value blkstat)",
            "block_error": "$(status_value blkerr)",
            "wad": "$(status_value wad)",
            "doom": "$(status_value doom)",
            "doomrun": "$(status_value doomrun)",
            "panic": "$(status_value panic)",
            "path": "$(status_value path)",
            "exec_counters": "$(status_value execsys)",
            "exec_map": "$(status_value execmap)",
            "exec_copy": "$(status_value execcopy)",
            "vfs_ops": "$(status_value vfsops)",
            "vfs_abi": "$(status_value vfsabi)",
            "audio_abi": "$(status_value audabi)",
            "exec_error": "$(status_value execerr)",
            "exec_result": "$(status_value execres)",
            "exec_target": "$(status_value target)",
            "exec_parent_pid": "$(status_value ppid)",
            "exec_entry": "$(status_value entry)",
            "exec_stack": "$(status_value stack)",
            "exec_argc": "$(status_value argc)",
            "exec_argv0": "$(status_value argv0)",
            "exec_envp0": "$(status_value envp0)",
            "exec_argv_source": "$(status_value argvsrc)",
            "user_exec": "$(status_value uexec)",
            "user_exec_pid": "$(status_value upid)",
            "user_exec_entry": "$(status_value uentry)",
            "user_exec_flags": "$(status_value uflags)",
            "abi_exec": "$(status_value abiexec)",
            "abi_exec_pid": "$(status_value abipid)",
            "abi_exec_parent_pid": "$(status_value abippid)",
            "abi_exec_entry": "$(status_value abientry)",
            "abi_exec_argc": "$(status_value abiargc)",
            "abi_exec_argv_source": "$(status_value abiargvsrc)",
            "abi_probe": "$(status_value abiprobe)",
            "abi_flags": "$(status_value abiflags)",
            "process_status": "$(status_value pstat)",
            "fault_frame": "$(status_value fault)",
            "page_fault_frame": "$(status_value pf)",
            "fault_source": "$(status_value faultsrc)",
            "fault_mode": "$(status_value faultmode)",
            "fault_containment": "$(status_value faultcontain)",
            "fault_registers": "$(status_value regs)",
            "fault_segments": "$(status_value segs)",
            "syscall_segments": "$(status_value syssegs)",
            "syscall_frame": "$(status_value sysframe)",
            "fault_process": "$(status_value proc)",
            "artifact_policy": {
              "status_only": true,
              "contains_wad_data": false,
              "contains_disk_image": false,
              "contains_screenshots": false,
              "contains_pixels": false,
              "contains_raw_audio": false
            }
          }
          JSON
          }

          wait_for_status_field() {
            pattern="$1"
            timeout_seconds="$2"
            end=$((SECONDS + timeout_seconds))
            while [ "$SECONDS" -le "$end" ]; do
              capture_status || true
              if [ -s build/uefi-ovmf-proof/status.txt ] && grep -Eq "$pattern" build/uefi-ovmf-proof/status.txt; then
                return 0
              fi
              if ! kill -0 "$qemu_pid" 2>/dev/null; then
                wait "$qemu_pid" || true
                return 1
              fi
              sleep 2
            done
            return 1
          }

          require_status_field() {
            pattern="$1"
            timeout_seconds="$2"
            if wait_for_status_field "$pattern" "$timeout_seconds"; then
              write_guest_status_manifest ""
              return 0
            fi
            write_guest_status_manifest "$pattern"
            echo "UEFI guest status check did not observe required pattern: $pattern" >&2
            exit 1
          }

          require_status_field 'uefi=OK' 45
          if [ "${{ inputs.proof_mode }}" = "prove" ]; then
            for _ in $(seq 1 45); do
              capture_status || true
              if status_has 'doomrun=(RUN|EXIT)'; then
                break
              fi
              if ! kill -0 "$qemu_pid" 2>/dev/null; then
                wait "$qemu_pid" || true
                break
              fi
              sleep 2
            done
            write_guest_status_manifest ""
          fi

          printf 'quit\n' | nc -w 2 -U "$monitor_sock" >/dev/null 2>&1 || true
          wait "$qemu_pid" >/dev/null 2>&1 || true
          trap - EXIT
          qemu_pid=""
          test -s build/uefi-ovmf-proof/debugcon-402.log
          test -s build/uefi-ovmf-proof/status.txt

      - name: Validate UEFI OVMF markers
        if: ${{ inputs.proof_mode != 'contract' }}
        run: |
          set -euo pipefail

          log=build/uefi-ovmf-proof/debugcon-402.log
          marker_file=build/uefi-ovmf-proof/markers.txt
          tr -d '\r' < "$log" | grep -aE 'VIBE(UEFI|KERN)' > "$marker_file"

          grep -q 'VIBEUEFI step=entry' "$marker_file"
          grep -q 'VIBEUEFI step=esp-kernel-read' "$marker_file"
          grep -q 'VIBEUEFI step=low-memory-reserve status=success' "$marker_file"
          grep -q 'VIBEUEFI step=elf32-load status=success' "$marker_file"
          grep -q 'VIBEUEFI step=boot-info status=success' "$marker_file"
          grep -q 'VIBEUEFI step=low-handoff-copy status=success' "$marker_file"
          grep -q 'VIBEUEFI step=exit-boot-services status=success' "$marker_file"
          grep -q 'VIBEUEFI step=kernel-handoff status=attempting' "$marker_file"
          grep -Eq 'handoff=0x0000000000009000' "$marker_file"
          grep -Eq 'bootinfo=0x0000000000007000' "$marker_file"
          grep -Eq 'e820=0x0000000000007100' "$marker_file"
          grep -Eq 'tramp32=0x0000000000008000' "$marker_file"
          grep -Eq 'transition64=0x000000000000A000' "$marker_file"
          grep -Eq 'segments=0x000000000000000[1-9A-F]' "$marker_file"

          kernel_marker_count=$(grep -c 'VIBEKERN step=uefi-entry status=OK' "$marker_file" || true)
          if [ "${{ inputs.proof_mode }}" = "prove" ] && [ "$kernel_marker_count" -eq 0 ]; then
            echo "prove mode requires the kernel-owned VIBEKERN UEFI entry marker." >&2
            exit 1
          fi

          status=build/uefi-ovmf-proof/status.txt
          grep -q 'uefi=OK' "$status"

          if [ "${{ inputs.proof_mode }}" = "prove" ] \
            && grep -q 'ata=OK' "$status" \
            && grep -q 'blkpart=MBR' "$status" \
            && grep -q 'wad=OK' "$status" \
            && grep -q 'path=DOOM[.]ELF' "$status" \
            && grep -q 'doom=OK' "$status" \
            && grep -Eq 'doomrun=(RUN|EXIT)' "$status"; then
            guest_storage_proof=true
          else
            guest_storage_proof=false
          fi

          cat > build/uefi-ovmf-proof/ovmf-proof.json <<JSON
          {
            "schema": "uefi-ovmf-proof-v1",
            "mode": "${{ inputs.proof_mode }}",
            "dual_bios_uefi_image_built": true,
            "fat16_partition_built": true,
            "ovmf_ran_in_disposable_cloud": true,
            "loader_entry_marker": true,
            "esp_kernel_read_marker": true,
            "low_handoff_copy_marker": true,
            "exit_boot_services_marker": true,
            "kernel_handoff_attempt_marker": true,
            "kernel_entry_marker_count": $kernel_marker_count,
            "guest_status_page_captured": true,
            "guest_uefi_status_ok": true,
            "guest_generated_wad_storage_and_doom_exec_proof": $guest_storage_proof,
            "prove_mode_kernel_entry_required": $([ "${{ inputs.proof_mode }}" = "prove" ] && echo true || echo false),
            "artifact_uploaded": false
          }
          JSON

          rm -f "$log" "$marker_file" build/uefi/uefi-fat16.img build/uefi-ovmf-proof/OVMF_VARS.fd build/uefi-ovmf-proof/bootx64.file.txt build/uefi-ovmf-proof/dual-image-inspect.txt build/uefi-ovmf-proof/status.bin build/uefi-ovmf-proof/status.txt build/uefi-ovmf-proof/monitor.sock build/uefi-ovmf-proof/monitor.log build/uefi-ovmf-proof/serial.log build/uefi-ovmf-proof/qemu.log

      - name: Write cloud proof run identity
        if: always()
        run: |
          mkdir -p build/uefi-ovmf-proof
          cat > build/uefi-ovmf-proof/cloud-proof-run.json <<JSON
          {
            "schema": "cloud-proof-run-v1",
            "workflow": "uefi-ovmf-proof.yml",
            "artifact": "uefi-ovmf-proof-manifests",
            "ref": "${GITHUB_REF_NAME:-}",
            "sha": "${GITHUB_SHA:-}",
            "run_id": "${GITHUB_RUN_ID:-}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT:-}",
            "runner": "github-actions-ubuntu",
            "local_qemu_required": false,
            "artifact_policy": {
              "status_only": true,
              "uploads_json_manifests_only": true,
              "contains_wad_data": false,
              "contains_disk_image": false,
              "contains_screenshots": false,
              "contains_pixels": false,
              "contains_raw_audio": false
            }
          }
          JSON

      - name: Upload UEFI proof manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-ovmf-proof-manifests
          if-no-files-found: ignore
          path: |
            build/uefi-ovmf-proof/**/*.json
