name: Real WAD smoke

on:
  workflow_dispatch:
    inputs:
      wad_url:
        description: Optional URL to a DOOM1.WAD, DOOM1.WAD.gz, or zip containing DOOM1.WAD. Empty uses REAL_DOOM_WAD_URL, then the public Archive.org shareware fallback.
        required: false
        type: string
      persistence_proof:
        description: Also attempt a same-runner reboot persistence proof against the mutated disk image.
        required: false
        type: boolean
        default: false
      persistence_input_script:
        description: QEMU input script for the first persistence boot. Use auto to wait for DEFAULT.CFG, Use text=NAME for batched save-name typing, or create the requested DOOMSAV slot when persistence_save_slot is set.
        required: false
        type: string
        default: "auto"
      persistence_load_input_script:
        description: QEMU input script for the reboot/load boot. Use auto with persistence_save_slot to load the saved slot through Doom's menu.
        required: false
        type: string
        default: "auto"
      persistence_save_slot:
        description: Optional DOOMSAV slot number to require if the input script creates a save.
        required: false
        type: string
      audible_audio_proof:
        description: Also capture temporary QEMU WAV output, reduce it to aggregate audio-proof.json, and delete the WAV.
        required: false
        type: boolean
        default: false
      expected_ref:
        description: Optional branch/ref guard. Set this to the branch you meant to prove; the job fails before toolchain install or WAD fetch if the selected workflow ref differs.
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Boot with validated shareware DOOM1.WAD
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      INPUT_DOOM_WAD_URL: ${{ inputs.wad_url }}
      AUDIBLE_AUDIO_PROOF: ${{ inputs.audible_audio_proof }}
      PERSISTENCE_INPUT_SCRIPT: ${{ inputs.persistence_input_script }}
      PERSISTENCE_LOAD_INPUT_SCRIPT: ${{ inputs.persistence_load_input_script }}
      PERSISTENCE_SAVE_SLOT: ${{ inputs.persistence_save_slot }}
      INPUT_EXPECTED_REF: ${{ inputs.expected_ref }}
      REAL_DOOM_WAD_URL: ${{ secrets.REAL_DOOM_WAD_URL }}
      PUBLIC_SHAREWARE_WAD_GZ_URL: https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz
      EXPECTED_WAD_SHA1: 5b2e249b9c5133ec987b3ea77596381dc0d6bc1d
      EXPECTED_WAD_BYTES: "4196020"
      WAD_PATH: /tmp/DOOM1.WAD

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm selected proof ref
        run: |
          set -euo pipefail

          if [ -n "${INPUT_EXPECTED_REF:-}" ] && [ "$GITHUB_REF_NAME" != "$INPUT_EXPECTED_REF" ]; then
            echo "expected_ref '$INPUT_EXPECTED_REF' does not match selected workflow ref '$GITHUB_REF_NAME'." >&2
            echo "Use the Run workflow branch selector or gh workflow run real-wad-smoke.yml --ref '$INPUT_EXPECTED_REF'." >&2
            exit 1
          fi

          echo "Running real-WAD smoke proof on ref '$GITHUB_REF_NAME' at commit '$GITHUB_SHA'."

      - name: Install OS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 clang make netcat-openbsd curl

      - name: Fetch and validate shareware WAD
        run: |
          set -euo pipefail

          url="${INPUT_DOOM_WAD_URL:-}"
          source_label="workflow input"
          if [ -z "$url" ]; then
            url="${REAL_DOOM_WAD_URL:-}"
            source_label="REAL_DOOM_WAD_URL secret"
          fi
          if [ -z "$url" ]; then
            url="$PUBLIC_SHAREWARE_WAD_GZ_URL"
            source_label="public Archive.org shareware fallback"
          fi

          echo "Fetching DOOM1.WAD source from ${source_label}."
          curl --fail --silent --show-error --location "$url" --output "$RUNNER_TEMP/wad-source"
          python3 - <<'PY'
          import gzip
          import hashlib
          import io
          import os
          import zipfile
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "wad-source"
          path = Path(os.environ["WAD_PATH"])
          raw = source.read_bytes()

          if raw[:2] == b"\x1f\x8b":
              data = gzip.decompress(raw)
          elif raw[:4] == b"PK\x03\x04":
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  matches = [
                      name for name in archive.namelist()
                      if Path(name).name.upper() == "DOOM1.WAD"
                  ]
                  if not matches:
                      raise SystemExit("zip archive does not contain DOOM1.WAD")
                  data = archive.read(matches[0])
          elif raw[:4] in (b"IWAD", b"PWAD"):
              data = raw
          else:
              raise SystemExit("downloaded file is not a WAD, gzip-compressed WAD, or zip containing DOOM1.WAD")

          path.write_bytes(data)
          source.unlink()

          expected_sha1 = os.environ["EXPECTED_WAD_SHA1"]
          expected_size = int(os.environ["EXPECTED_WAD_BYTES"])
          actual_sha1 = hashlib.sha1(data).hexdigest()
          actual_size = len(data)

          if data[:4] != b"IWAD":
              raise SystemExit("extracted DOOM1.WAD is not an IWAD")
          if actual_size != expected_size:
              raise SystemExit(f"DOOM1.WAD size mismatch: got {actual_size}, expected {expected_size}")
          if actual_sha1 != expected_sha1:
              raise SystemExit(f"DOOM1.WAD SHA-1 mismatch: got {actual_sha1}, expected {expected_sha1}")

          print(f"Validated shareware DOOM1.WAD: {actual_size} bytes, SHA-1 {actual_sha1}")
          PY

      - name: Rebuild real-WAD image
        run: |
          make clean
          make DOOM_WAD="$WAD_PATH"

      - name: Capture fresh persistence baseline
        if: ${{ inputs.persistence_proof }}
        run: |
          set -euo pipefail
          cp build/disk.img "$RUNNER_TEMP/disk.before-persistence.img"

      - name: Boot real-WAD image
        timeout-minutes: 4
        run: |
          audio_backend="-audiodev none,id=snd0 -device sb16,audiodev=snd0"
          if [ "${AUDIBLE_AUDIO_PROOF}" = "true" ]; then
            audio_backend="-audiodev wav,id=snd0,path=build/doom-audio.wav -device sb16,audiodev=snd0"
          fi

          make \
            DOOM_WAD="$WAD_PATH" \
            ALLOW_LOCAL_VM=1 \
            QEMU_EXTRA_ARGS="$audio_backend" \
            SMOKE_EXPECT_PROBE_GFX=0 \
            SMOKE_CAPTURE_GFX=0 \
            SMOKE_QEMU_TIMEOUT=120 \
            SMOKE_EARLY_SECONDS=2 \
            SMOKE_SETTLE_SECONDS=20 \
            SMOKE_SKIP_ASSERTIONS=1 \
            SMOKE_INPUT_SCRIPT="after-start:wait=2,snapshot after-fire:hold=ctrl:800,wait-status-min=pflags:000000C5:80:2,wait=1,snapshot after-move:hold=up:1200,wait-status-min=pdelta:00000001:80:2,wait=1,snapshot after-use:hold=spc:3000,snapshot,wait=2 after-mouse:mousebtn=1,wait=1,mouse=4:0,wait=1,mousebtn=0,wait=1,mouse=64:0,wait-status-min=pangledelta:00000001:80:2,wait=1,snapshot after-menu:esc,wait=2,snapshot" \
            smoke

      - name: Analyze temporary audible audio capture
        if: ${{ always() && inputs.audible_audio_proof }}
        run: |
          set -euo pipefail
          trap 'rm -f build/doom-audio.wav' EXIT
          python3 tools/check_audible_audio_proof.py \
            --analyze-wav build/doom-audio.wav \
            --status build/status.txt \
            --baseline build/status.after-start.txt \
            --fire build/status.after-fire.txt \
            --movement build/status.after-move.txt \
            --use build/status.after-use.txt \
            --menu build/status.after-menu.txt \
            --output build/audio-proof.json
          python3 tools/check_audible_audio_proof.py build/audio-proof.json

      - name: Assert real-WAD proof gates
        if: always()
        run: |
          python3 tools/check_real_wad_proof.py \
            --baseline build/status.after-start.txt \
            --start build/status.after-start.txt \
            --fire build/status.after-fire.txt \
            --movement build/status.after-move.txt \
            --use build/status.after-use.txt \
            --mouse build/status.after-mouse.txt \
            --menu build/status.after-menu.txt \
            build/status.txt

      - name: Assert scripted human-playability gates
        if: always()
        run: |
          python3 tools/check_human_playability_proof.py \
            --baseline build/status.after-start.txt \
            --start build/status.after-start.txt \
            --fire build/status.after-fire.txt \
            --movement build/status.after-move.txt \
            --use build/status.after-use.txt \
            --mouse build/status.after-mouse.txt \
            --menu build/status.after-menu.txt \
            build/status.txt

      - name: Assert scripted gameplay transition gates
        if: always()
        run: |
          python3 tools/check_scripted_gameplay_proof.py \
            --start build/status.after-start.txt \
            --fire build/status.after-fire.txt \
            --movement build/status.after-move.txt \
            --use build/status.after-use.txt \
            --mouse build/status.after-mouse.txt \
            --menu build/status.after-menu.txt \
            --write-json build/gameplay-proof.json \
            build/status.txt

      - name: Assert VM/process legitimacy gates
        if: always()
        run: |
          python3 tools/check_vm_status_proof.py \
            --require-exec \
            --require-preempt \
            build/status.txt

      - name: Assert SB16 audio continuity gates
        if: always()
        run: |
          python3 tools/check_audio_continuity_proof.py \
            --require-pull-stream \
            --baseline build/status.after-start.txt \
            --fire build/status.after-fire.txt \
            --movement build/status.after-move.txt \
            --use build/status.after-use.txt \
            --menu build/status.after-menu.txt \
            build/status.txt

      - name: Assert audible audio proof manifest
        if: ${{ always() && inputs.audible_audio_proof }}
        run: |
          test -f build/audio-proof.json
          python3 tools/check_audible_audio_proof.py build/audio-proof.json

      - name: Assert gameplay/audio proof bundle
        if: always()
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/gameplay-audio-proof"
          rm -rf "$proof_dir"
          mkdir -p "$proof_dir"
          cp build/kernel.elf build/user_probe.elf build/doom.elf build/doom.symbols "$proof_dir"/
          cp build/status*.txt build/status*.bin "$proof_dir"/
          cp build/*.log "$proof_dir"/ 2>/dev/null || true
          cp build/gameplay-proof.json "$proof_dir"/
          if [ -f build/audio-proof.json ]; then
            cp build/audio-proof.json "$proof_dir"/
          fi
          proof_args=(--require-gameplay-proof)
          if [ "${AUDIBLE_AUDIO_PROOF}" = "true" ]; then
            proof_args+=(--require-audible-proof)
          fi
          python3 tools/check_cloud_playability_artifacts.py "$proof_dir" "${proof_args[@]}"

      - name: Triage cloud status
        if: always()
        run: |
          if [ -f build/status.txt ]; then
            python3 tools/triage_cloud_status.py build/status.txt
          else
            echo "No final status.txt available for triage."
          fi

      - name: Show smoke diagnostics
        if: always()
        run: |
          for file in $(find build -maxdepth 1 -type f \( -name 'status*.txt' -o -name '*.log' \) | sort); do
            if [ -f "$file" ]; then
              echo "---- $file ----"
              sed -n '1,220p' "$file"
            fi
          done

      - name: Attempt reboot persistence proof
        if: ${{ always() && inputs.persistence_proof }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP"/persistence-*-audio.wav' EXIT

          baseline="$RUNNER_TEMP/disk.before-persistence.img"
          after_write="$RUNNER_TEMP/disk.after-persistence-write.img"
          check_args=(--baseline-image "$baseline")
          persistence_write_script="$PERSISTENCE_INPUT_SCRIPT"
          persistence_load_script="$PERSISTENCE_LOAD_INPUT_SCRIPT"
          persistence_default_script=""
          if [ -n "${PERSISTENCE_SAVE_SLOT:-}" ]; then
            case "$PERSISTENCE_SAVE_SLOT" in
              0|1|2|3|4|5) ;;
              *)
                echo "persistence_save_slot must be 0..5, got '$PERSISTENCE_SAVE_SLOT'." >&2
                exit 1
                ;;
            esac
            if [ "$persistence_write_script" = "auto" ]; then
              persistence_write_script="save-slot-${PERSISTENCE_SAVE_SLOT}:wait-status=gameplay:OK:150:5,wait-status-part-min=savewr:1:00000001:180:2,wait-status-min=saveclose:00000001:120:2,snapshot"
            fi
            if [ "$persistence_load_script" = "auto" ]; then
              persistence_load_script="load-slot-${PERSISTENCE_SAVE_SLOT}:wait-status=gameplay:OK:150:5,wait-status-part-min=saverd:1:00000001:120:2,wait=2,wait-status=gameplay:OK:60:2,snapshot"
            fi
            persistence_default_script="persist-default:wait-status=gameplay:OK:150:5,wait-status-min=doomwrite:00000001:120:2,wait-status-min=doomclose:00000003:120:2,snapshot"
            check_args+=(--require-save-slot "$PERSISTENCE_SAVE_SLOT")
            check_args+=(--save-write-status build/status.persistence-write.txt)
          else
            if [ "$persistence_write_script" = "auto" ]; then
              persistence_write_script="persist-default:wait-status=gameplay:OK:150:5,wait-status-min=doomwrite:00000001:120:2,wait-status-min=doomclose:00000003:120:2,snapshot"
            fi
            if [ "$persistence_load_script" = "auto" ]; then
              persistence_load_script=""
            fi
            check_args+=(--require-default)
            check_args+=(--write-status build/status.persistence-write.txt)
          fi
          echo "Persistence write script: ${persistence_write_script:-<none>}"
          echo "Persistence load script: ${persistence_load_script:-<none>}"

          write_marker() {
            local marker_name="$1"
            local marker_payload="${2:-}"
            PERSISTENCE_MARKER_NAME="$marker_name" \
            PERSISTENCE_MARKER_PAYLOAD="$marker_payload" \
              python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "make_wad_image",
              Path("tools/make_wad_image.py"),
          )
          make_wad_image = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(make_wad_image)

          path = Path("build/disk.img")
          image = bytearray(path.read_bytes())
          fs = make_wad_image.Fat16Image(image)
          name = getattr(make_wad_image, os.environ["PERSISTENCE_MARKER_NAME"])
          fs.write_root_file(
              name,
              os.environ["PERSISTENCE_MARKER_PAYLOAD"].encode("ascii"),
          )
          path.write_bytes(image)
          PY
          }

          delete_marker() {
            local marker_name="$1"
            PERSISTENCE_MARKER_NAME="$marker_name" \
              python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "make_wad_image",
              Path("tools/make_wad_image.py"),
          )
          make_wad_image = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(make_wad_image)

          path = Path("build/disk.img")
          image = bytearray(path.read_bytes())
          fs = make_wad_image.Fat16Image(image)
          name = getattr(make_wad_image, os.environ["PERSISTENCE_MARKER_NAME"])
          if fs.root_file_metadata(name) is not None:
              fs.delete_root_file(name)
              path.write_bytes(image)
          PY
          }

          test -f "$baseline"
          cp "$baseline" build/disk.img
          if [ -z "${PERSISTENCE_SAVE_SLOT:-}" ]; then
            write_marker PERSISTENCE_CHECKPOINT_NAME ""
          else
            write_marker SAVE_REQUEST_NAME "$PERSISTENCE_SAVE_SLOT"
          fi

          mkdir -p build/persistence-write
          QEMU=qemu-system-x86_64 \
            QEMU_MACHINE=pc,accel=tcg \
            QEMU_EXTRA_ARGS="-audiodev wav,id=snd0,path=$RUNNER_TEMP/persistence-write-audio.wav -device sb16,audiodev=snd0" \
            IMAGE=build/disk.img \
            BUILD_DIR=build/persistence-write \
            NC=nc \
            SMOKE_CAPTURE_GFX=0 \
            SMOKE_QEMU_TIMEOUT=620 \
            SMOKE_EARLY_SECONDS=2 \
            SMOKE_SETTLE_SECONDS=20 \
            SMOKE_INPUT_SCRIPT="$persistence_write_script" \
            tests/run_smoke_qemu.sh
          if [ -n "${PERSISTENCE_SAVE_SLOT:-}" ]; then
            write_status="build/persistence-write/status.save-slot-${PERSISTENCE_SAVE_SLOT}.txt"
          else
            write_status="build/persistence-write/status.txt"
          fi
          test -f "$write_status"
          cp "$write_status" build/status.persistence-write.txt

          python3 tools/check_doom_persistence_image.py "${check_args[@]}" build/disk.img \
            | tee build/status.persistence-write-proof.txt

          if [ -n "${PERSISTENCE_SAVE_SLOT:-}" ]; then
            delete_marker SAVE_REQUEST_NAME
            write_marker PERSISTENCE_CHECKPOINT_NAME ""
            mkdir -p build/persistence-default
            QEMU=qemu-system-x86_64 \
              QEMU_MACHINE=pc,accel=tcg \
              QEMU_EXTRA_ARGS="-audiodev wav,id=snd0,path=$RUNNER_TEMP/persistence-default-audio.wav -device sb16,audiodev=snd0" \
              IMAGE=build/disk.img \
              BUILD_DIR=build/persistence-default \
              NC=nc \
              SMOKE_CAPTURE_GFX=0 \
              SMOKE_QEMU_TIMEOUT=420 \
              SMOKE_EARLY_SECONDS=2 \
              SMOKE_SETTLE_SECONDS=20 \
              SMOKE_INPUT_SCRIPT="$persistence_default_script" \
              tests/run_smoke_qemu.sh
            cp build/persistence-default/status.txt build/status.persistence-default.txt
            check_args+=(--require-default)
            check_args+=(--write-status build/status.persistence-default.txt)
            python3 tools/check_doom_persistence_image.py "${check_args[@]}" build/disk.img \
              | tee build/status.persistence-default-proof.txt
            cp build/disk.img "$after_write"
            write_marker LOAD_REQUEST_NAME "$PERSISTENCE_SAVE_SLOT"

            mkdir -p build/persistence-load
            QEMU=qemu-system-x86_64 \
              QEMU_MACHINE=pc,accel=tcg \
              QEMU_EXTRA_ARGS="-audiodev wav,id=snd0,path=$RUNNER_TEMP/persistence-load-audio.wav -device sb16,audiodev=snd0" \
              IMAGE=build/disk.img \
              BUILD_DIR=build/persistence-load \
              NC=nc \
              SMOKE_CAPTURE_GFX=0 \
              SMOKE_QEMU_TIMEOUT=420 \
              SMOKE_EARLY_SECONDS=2 \
              SMOKE_SETTLE_SECONDS=12 \
              SMOKE_INPUT_SCRIPT="$persistence_load_script" \
              tests/run_smoke_qemu.sh
            cp build/persistence-load/status.txt build/status.persistence-load.txt
            cp build/status.persistence-load.txt build/status.persistence-reboot.txt

            python3 tools/check_doom_persistence_image.py \
              "${check_args[@]}" \
              --reboot-baseline-image "$after_write" \
              --reboot-status build/status.persistence-load.txt \
              --load-status build/status.persistence-load.txt \
              build/disk.img \
              | tee build/status.persistence-load-proof.txt
            cp build/status.persistence-load-proof.txt build/status.persistence-reboot-proof.txt
          else
            cp build/disk.img "$after_write"
            mkdir -p build/persistence-reboot
            QEMU=qemu-system-x86_64 \
              QEMU_MACHINE=pc,accel=tcg \
              QEMU_EXTRA_ARGS="-audiodev wav,id=snd0,path=$RUNNER_TEMP/persistence-reboot-audio.wav -device sb16,audiodev=snd0" \
              IMAGE=build/disk.img \
              BUILD_DIR=build/persistence-reboot \
              NC=nc \
              SMOKE_CAPTURE_GFX=0 \
              SMOKE_QEMU_TIMEOUT=180 \
              SMOKE_EARLY_SECONDS=2 \
              SMOKE_SETTLE_SECONDS=12 \
              tests/run_smoke_qemu.sh
            cp build/persistence-reboot/status.txt build/status.persistence-reboot.txt

            python3 tools/check_doom_persistence_image.py \
              "${check_args[@]}" \
              --reboot-baseline-image "$after_write" \
              --reboot-status build/status.persistence-reboot.txt \
              build/disk.img \
              | tee build/status.persistence-reboot-proof.txt
          fi

      - name: Re-check validated WAD after smoke
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          path = Path(os.environ["WAD_PATH"])
          data = path.read_bytes()
          actual_sha1 = hashlib.sha1(data).hexdigest()
          actual_size = len(data)
          assert actual_sha1 == os.environ["EXPECTED_WAD_SHA1"], actual_sha1
          assert actual_size == int(os.environ["EXPECTED_WAD_BYTES"]), actual_size
          print(f"Post-smoke WAD still validated locally: {actual_size} bytes, SHA-1 {actual_sha1}")
          PY
          rm -f "$WAD_PATH" "$RUNNER_TEMP/wad-source"

      - name: Upload non-copyright diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-wad-smoke-status
          if-no-files-found: ignore
          path: |
            build/kernel.elf
            build/user_probe.elf
            build/doom.elf
            build/doom.symbols
            build/audio-proof.json
            build/gameplay-proof.json
            build/status*.bin
            build/status*.txt
            build/*.log
            build/persistence-*/*.log
            build/persistence-*/*.txt
