name: Real WAD smoke

on:
  workflow_dispatch:
    inputs:
      wad_url:
        description: Optional URL to a DOOM1.WAD, DOOM1.WAD.gz, or zip containing DOOM1.WAD. Empty uses REAL_DOOM_WAD_URL, then the public Archive.org shareware fallback.
        required: false
        type: string
      persistence_proof:
        description: Also attempt a same-runner reboot persistence proof against the mutated disk image.
        required: false
        type: boolean
        default: false
      persistence_input_script:
        description: QEMU input script for the first persistence boot. Use text=NAME to batch save-name typing; default sends the platform quit signal so Doom saves DEFAULT.CFG through I_Quit.
        required: false
        type: string
        default: "persist-quit:ctrl-alt-f12,wait=12,snapshot"
      persistence_save_slot:
        description: Optional DOOMSAV slot number to require if the input script creates a save.
        required: false
        type: string
      audible_audio_proof:
        description: Also capture temporary QEMU WAV output, reduce it to aggregate audio-proof.json, and delete the WAV.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    name: Boot with validated shareware DOOM1.WAD
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      INPUT_DOOM_WAD_URL: ${{ inputs.wad_url }}
      AUDIBLE_AUDIO_PROOF: ${{ inputs.audible_audio_proof }}
      PERSISTENCE_INPUT_SCRIPT: ${{ inputs.persistence_input_script }}
      PERSISTENCE_SAVE_SLOT: ${{ inputs.persistence_save_slot }}
      REAL_DOOM_WAD_URL: ${{ secrets.REAL_DOOM_WAD_URL }}
      PUBLIC_SHAREWARE_WAD_GZ_URL: https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz
      EXPECTED_WAD_SHA1: 5b2e249b9c5133ec987b3ea77596381dc0d6bc1d
      EXPECTED_WAD_BYTES: "4196020"
      WAD_PATH: /tmp/DOOM1.WAD

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 clang make netcat-openbsd curl

      - name: Fetch and validate shareware WAD
        run: |
          set -euo pipefail

          url="${INPUT_DOOM_WAD_URL:-}"
          source_label="workflow input"
          if [ -z "$url" ]; then
            url="${REAL_DOOM_WAD_URL:-}"
            source_label="REAL_DOOM_WAD_URL secret"
          fi
          if [ -z "$url" ]; then
            url="$PUBLIC_SHAREWARE_WAD_GZ_URL"
            source_label="public Archive.org shareware fallback"
          fi

          echo "Fetching DOOM1.WAD source from ${source_label}."
          curl --fail --silent --show-error --location "$url" --output "$RUNNER_TEMP/wad-source"
          python3 - <<'PY'
          import gzip
          import hashlib
          import io
          import os
          import zipfile
          from pathlib import Path

          source = Path(os.environ["RUNNER_TEMP"]) / "wad-source"
          path = Path(os.environ["WAD_PATH"])
          raw = source.read_bytes()

          if raw[:2] == b"\x1f\x8b":
              data = gzip.decompress(raw)
          elif raw[:4] == b"PK\x03\x04":
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  matches = [
                      name for name in archive.namelist()
                      if Path(name).name.upper() == "DOOM1.WAD"
                  ]
                  if not matches:
                      raise SystemExit("zip archive does not contain DOOM1.WAD")
                  data = archive.read(matches[0])
          elif raw[:4] in (b"IWAD", b"PWAD"):
              data = raw
          else:
              raise SystemExit("downloaded file is not a WAD, gzip-compressed WAD, or zip containing DOOM1.WAD")

          path.write_bytes(data)
          source.unlink()

          expected_sha1 = os.environ["EXPECTED_WAD_SHA1"]
          expected_size = int(os.environ["EXPECTED_WAD_BYTES"])
          actual_sha1 = hashlib.sha1(data).hexdigest()
          actual_size = len(data)

          if data[:4] != b"IWAD":
              raise SystemExit("extracted DOOM1.WAD is not an IWAD")
          if actual_size != expected_size:
              raise SystemExit(f"DOOM1.WAD size mismatch: got {actual_size}, expected {expected_size}")
          if actual_sha1 != expected_sha1:
              raise SystemExit(f"DOOM1.WAD SHA-1 mismatch: got {actual_sha1}, expected {expected_sha1}")

          print(f"Validated shareware DOOM1.WAD: {actual_size} bytes, SHA-1 {actual_sha1}")
          PY

      - name: Rebuild real-WAD image
        run: |
          make clean
          make DOOM_WAD="$WAD_PATH"

      - name: Capture fresh persistence baseline
        if: ${{ inputs.persistence_proof }}
        run: |
          set -euo pipefail
          cp build/disk.img "$RUNNER_TEMP/disk.before-persistence.img"

      - name: Boot real-WAD image
        timeout-minutes: 4
        run: |
          audio_backend="-audiodev none,id=snd0 -device sb16,audiodev=snd0"
          if [ "${AUDIBLE_AUDIO_PROOF}" = "true" ]; then
            audio_backend="-audiodev wav,id=snd0,path=build/doom-audio.wav -device sb16,audiodev=snd0"
          fi

          make \
            DOOM_WAD="$WAD_PATH" \
            ALLOW_LOCAL_VM=1 \
            QEMU_EXTRA_ARGS="$audio_backend" \
            SMOKE_EXPECT_PROBE_GFX=0 \
            SMOKE_CAPTURE_GFX=0 \
            SMOKE_QEMU_TIMEOUT=120 \
            SMOKE_EARLY_SECONDS=2 \
            SMOKE_SETTLE_SECONDS=20 \
            SMOKE_SKIP_ASSERTIONS=1 \
            SMOKE_INPUT_SCRIPT="after-start:wait=2,snapshot after-fire:hold=ctrl:800,wait=2,snapshot after-move:hold=up:1200,wait=3,snapshot after-use:hold=spc:3000,snapshot,wait=2 after-mouse:mouse=24:-12,mouse=0:-12,mousebtn=1,wait=1,mousebtn=0,wait=2,snapshot after-menu:esc,wait=2,snapshot" \
            smoke

      - name: Analyze temporary audible audio capture
        if: ${{ always() && inputs.audible_audio_proof }}
        run: |
          set -euo pipefail
          trap 'rm -f build/doom-audio.wav' EXIT
          python3 tools/check_audible_audio_proof.py \
            --analyze-wav build/doom-audio.wav \
            --status build/status.txt \
            --baseline build/status.after-start.txt \
            --fire build/status.after-fire.txt \
            --movement build/status.after-move.txt \
            --use build/status.after-use.txt \
            --menu build/status.after-menu.txt \
            --output build/audio-proof.json
          python3 tools/check_audible_audio_proof.py build/audio-proof.json

      - name: Assert real-WAD proof gates
        if: always()
        run: |
          python3 tools/check_real_wad_proof.py \
            --baseline build/status.after-start.txt \
            --start build/status.after-start.txt \
            --fire build/status.after-fire.txt \
            --movement build/status.after-move.txt \
            --use build/status.after-use.txt \
            --mouse build/status.after-mouse.txt \
            --menu build/status.after-menu.txt \
            build/status.txt

      - name: Assert scripted human-playability gates
        if: always()
        run: |
          python3 tools/check_human_playability_proof.py \
            --baseline build/status.after-start.txt \
            --start build/status.after-start.txt \
            --fire build/status.after-fire.txt \
            --movement build/status.after-move.txt \
            --use build/status.after-use.txt \
            --mouse build/status.after-mouse.txt \
            --menu build/status.after-menu.txt \
            build/status.txt

      - name: Assert SB16 audio continuity gates
        if: always()
        run: |
          python3 tools/check_audio_continuity_proof.py \
            --baseline build/status.after-start.txt \
            --fire build/status.after-fire.txt \
            --movement build/status.after-move.txt \
            --use build/status.after-use.txt \
            --menu build/status.after-menu.txt \
            build/status.txt

      - name: Assert audible audio proof manifest
        if: ${{ always() && inputs.audible_audio_proof }}
        run: |
          test -f build/audio-proof.json
          python3 tools/check_audible_audio_proof.py build/audio-proof.json

      - name: Triage cloud status
        if: always()
        run: |
          if [ -f build/status.txt ]; then
            python3 tools/triage_cloud_status.py build/status.txt
          else
            echo "No final status.txt available for triage."
          fi

      - name: Show smoke diagnostics
        if: always()
        run: |
          for file in $(find build -maxdepth 1 -type f \( -name 'status*.txt' -o -name '*.log' \) | sort); do
            if [ -f "$file" ]; then
              echo "---- $file ----"
              sed -n '1,220p' "$file"
            fi
          done

      - name: Attempt reboot persistence proof
        if: ${{ always() && inputs.persistence_proof }}
        timeout-minutes: 6
        run: |
          set -euo pipefail

          baseline="$RUNNER_TEMP/disk.before-persistence.img"
          after_write="$RUNNER_TEMP/disk.after-persistence-write.img"
          check_args=(--baseline-image "$baseline")
          if [ -n "${PERSISTENCE_SAVE_SLOT:-}" ]; then
            check_args+=(--require-save-slot "$PERSISTENCE_SAVE_SLOT")
          else
            check_args+=(--require-default)
            check_args+=(--write-status build/status.persistence-write.txt)
          fi

          test -f "$baseline"
          cp "$baseline" build/disk.img

          mkdir -p build/persistence-write
          QEMU=qemu-system-x86_64 \
            QEMU_MACHINE=pc,accel=tcg \
            QEMU_EXTRA_ARGS="-audiodev none,id=snd0 -device sb16,audiodev=snd0" \
            IMAGE=build/disk.img \
            BUILD_DIR=build/persistence-write \
            NC=nc \
            SMOKE_CAPTURE_GFX=0 \
            SMOKE_QEMU_TIMEOUT=75 \
            SMOKE_EARLY_SECONDS=2 \
            SMOKE_SETTLE_SECONDS=20 \
            SMOKE_INPUT_SCRIPT="$PERSISTENCE_INPUT_SCRIPT" \
            tests/run_smoke_qemu.sh
          cp build/persistence-write/status.txt build/status.persistence-write.txt

          python3 tools/check_doom_persistence_image.py "${check_args[@]}" build/disk.img \
            | tee build/status.persistence-write-proof.txt
          cp build/disk.img "$after_write"

          mkdir -p build/persistence-reboot
          QEMU=qemu-system-x86_64 \
            QEMU_MACHINE=pc,accel=tcg \
            QEMU_EXTRA_ARGS="-audiodev none,id=snd0 -device sb16,audiodev=snd0" \
            IMAGE=build/disk.img \
            BUILD_DIR=build/persistence-reboot \
            NC=nc \
            SMOKE_CAPTURE_GFX=0 \
            SMOKE_QEMU_TIMEOUT=75 \
            SMOKE_EARLY_SECONDS=2 \
            SMOKE_SETTLE_SECONDS=12 \
            tests/run_smoke_qemu.sh
          cp build/persistence-reboot/status.txt build/status.persistence-reboot.txt

          python3 tools/check_doom_persistence_image.py \
            "${check_args[@]}" \
            --reboot-baseline-image "$after_write" \
            --reboot-status build/status.persistence-reboot.txt \
            build/disk.img \
            | tee build/status.persistence-reboot-proof.txt

      - name: Re-check validated WAD after smoke
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          path = Path(os.environ["WAD_PATH"])
          data = path.read_bytes()
          actual_sha1 = hashlib.sha1(data).hexdigest()
          actual_size = len(data)
          assert actual_sha1 == os.environ["EXPECTED_WAD_SHA1"], actual_sha1
          assert actual_size == int(os.environ["EXPECTED_WAD_BYTES"]), actual_size
          print(f"Post-smoke WAD still validated locally: {actual_size} bytes, SHA-1 {actual_sha1}")
          PY
          rm -f "$WAD_PATH" "$RUNNER_TEMP/wad-source"

      - name: Upload non-copyright diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-wad-smoke-status
          if-no-files-found: ignore
          path: |
            build/kernel.elf
            build/user_probe.elf
            build/doom.elf
            build/doom.symbols
            build/audio-proof.json
            build/status*.bin
            build/status*.txt
            build/*.log
            build/persistence-*/*.log
