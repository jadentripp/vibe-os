name: Real WAD smoke

on:
  workflow_dispatch:
    inputs:
      wad_url:
        description: Optional URL to a DOOM1.WAD, DOOM1.WAD.gz, or zip containing DOOM1.WAD. Empty uses REAL_DOOM_WAD_URL, then the public Archive.org shareware fallback.
        required: false
        type: string
      persistence_proof:
        description: Also attempt a same-runner reboot persistence proof against the mutated disk image.
        required: false
        type: boolean
        default: false
      persistence_input_script:
        description: QEMU input script for the first persistence boot. Use auto to wait for DEFAULT.CFG, Use text=NAME for batched save-name typing, or wait for the marker-requested DOOMSAV slot when persistence_save_slot is set.
        required: false
        type: string
        default: "auto"
      persistence_load_input_script:
        description: QEMU input script for the reboot/load boot. Use auto with persistence_save_slot to wait for the marker-requested load proof.
        required: false
        type: string
        default: "auto"
      persistence_save_slot:
        description: Optional DOOMSAV slot number to require. Providing this also enables the marker-driven reboot save/load persistence proof; leave audible_audio_proof false when isolating persistence.
        required: false
        type: string
      audible_audio_proof:
        description: Also capture temporary QEMU WAV output, reduce it to aggregate audio-proof.json, and delete the WAV; leave false for the fastest gameplay or persistence-only proof.
        required: false
        type: boolean
        default: false
      expected_ref:
        description: Optional branch/ref guard. Set this to the branch you meant to prove; the job fails before toolchain install or WAD fetch if the selected workflow ref differs.
        required: false
        type: string
      expected_sha:
        description: Optional exact commit guard. Set this to the main commit you meant to prove; the job fails before toolchain install or WAD fetch if GITHUB_SHA differs.
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Boot with validated shareware DOOM1.WAD
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      INPUT_DOOM_WAD_URL: ${{ inputs.wad_url }}
      AUDIBLE_AUDIO_PROOF: ${{ inputs.audible_audio_proof }}
      PERSISTENCE_INPUT_SCRIPT: ${{ inputs.persistence_input_script }}
      PERSISTENCE_LOAD_INPUT_SCRIPT: ${{ inputs.persistence_load_input_script }}
      PERSISTENCE_SAVE_SLOT: ${{ inputs.persistence_save_slot }}
      INPUT_EXPECTED_REF: ${{ inputs.expected_ref }}
      INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
      REAL_DOOM_WAD_URL: ${{ secrets.REAL_DOOM_WAD_URL }}
      PUBLIC_SHAREWARE_WAD_GZ_URL: https://archive.org/download/wadarchive/DATA/5b.zip/5b%2F2e249b9c5133ec987b3ea77596381dc0d6bc1d%2F5b2e249b9c5133ec987b3ea77596381dc0d6bc1d.wad.gz
      EXPECTED_WAD_SHA1: 5b2e249b9c5133ec987b3ea77596381dc0d6bc1d
      EXPECTED_WAD_BYTES: "4196020"
      WAD_PATH: /tmp/DOOM1.WAD

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Confirm selected proof ref
        run: |
          set -euo pipefail

          if [ -n "${INPUT_EXPECTED_REF:-}" ] && [ "$GITHUB_REF_NAME" != "$INPUT_EXPECTED_REF" ]; then
            echo "expected_ref '$INPUT_EXPECTED_REF' does not match selected workflow ref '$GITHUB_REF_NAME'." >&2
            echo "Use the Run workflow branch selector or gh workflow run real-wad-smoke.yml --ref '$INPUT_EXPECTED_REF'." >&2
            exit 1
          fi
          if [ -n "${INPUT_EXPECTED_SHA:-}" ] && [ "$GITHUB_SHA" != "$INPUT_EXPECTED_SHA" ]; then
            echo "expected_sha '$INPUT_EXPECTED_SHA' does not match selected workflow commit '$GITHUB_SHA'." >&2
            echo "Fetch/push main first, then rerun the post-merge cloud proof lane for the exact commit." >&2
            exit 1
          fi

          echo "Running real-WAD smoke proof on ref '$GITHUB_REF_NAME' at commit '$GITHUB_SHA'."

      - name: Summarize cloud proof lane
        run: |
          set -euo pipefail

          lane="gameplay"
          if [ "${AUDIBLE_AUDIO_PROOF}" = "true" ] && [ -n "${PERSISTENCE_SAVE_SLOT:-}" ]; then
            lane="full"
          elif [ "${AUDIBLE_AUDIO_PROOF}" = "true" ]; then
            lane="audio"
          elif [ -n "${PERSISTENCE_SAVE_SLOT:-}" ] || [ "${{ inputs.persistence_proof }}" = "true" ]; then
            lane="persistence"
          fi
          lane="${lane}+default-apic"

          echo "Proof lane: $lane"
          echo "Artifact policy: upload status/JSON proof only; no WADs, disk images, screenshots, rendered pixels, raw audio, logs, tokens, or one-time codes."
          echo "Failure lanes: gameplay/input, SB16 continuity, audible audio aggregate, and persistence/save-load are checked or triaged separately."
          echo "Status-only proof download command after completion:"
          echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name real-wad-smoke-proof-status --dir build/cloud-run-$GITHUB_RUN_ID"

          {
            echo "### Real WAD smoke"
            echo ""
            echo "- lane: \`$lane\`"
            echo "- ref: \`$GITHUB_REF_NAME\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- status-only proof artifact: \`real-wad-smoke-proof-status\`"
            echo "- local VM: refused by runbook; this job runs on a disposable GitHub-hosted runner"
            echo "- artifact policy: status/JSON proof only; no WADs, disk images, screenshots, rendered pixels, raw audio, logs, tokens, or one-time codes"
            echo ""
            echo "Failure lanes stay separate:"
            echo "- gameplay/input: guest status fields from the OS"
            echo "- SB16 continuity: guest status fields from the OS"
            echo "- audible audio aggregate: disabled until a minimal shell/C checker exists"
            echo "- persistence/save-load: optional reboot proof checked by the C FAT image checker when requested"
            echo ""
            echo "Persistence isolation: use \`audible_audio_proof=false\` with \`persistence_save_slot=0\` so save/load failures are not mixed with the audible-audio lane."
            echo ""
            echo "\`\`\`sh"
            echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name real-wad-smoke-proof-status --dir build/cloud-run-$GITHUB_RUN_ID"
            echo "tr ' ' '\\n' < build/cloud-run-$GITHUB_RUN_ID/status.txt | grep -E '^(panic|shutdown|doomrun|gameplay|audio)='"
            echo "# If the boot stopped before final status, use status.failure.txt instead."
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install OS toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm qemu-system-x86 clang make netcat-openbsd curl unzip

      - name: Fetch and validate shareware WAD
        run: |
          set -euo pipefail

          url="${INPUT_DOOM_WAD_URL:-}"
          source_label="workflow input"
          if [ -z "$url" ]; then
            url="${REAL_DOOM_WAD_URL:-}"
            source_label="REAL_DOOM_WAD_URL secret"
          fi
          if [ -z "$url" ]; then
            url="$PUBLIC_SHAREWARE_WAD_GZ_URL"
            source_label="public Archive.org shareware fallback"
          fi

          echo "Fetching DOOM1.WAD source from ${source_label}."
          curl --fail --silent --show-error --location "$url" --output "$RUNNER_TEMP/wad-source"
          magic4="$(od -An -N4 -tx1 "$RUNNER_TEMP/wad-source" | tr -d ' \n')"
          magic2="$(od -An -N2 -tx1 "$RUNNER_TEMP/wad-source" | tr -d ' \n')"
          if [ "$magic2" = "1f8b" ]; then
            gzip -cd "$RUNNER_TEMP/wad-source" > "$WAD_PATH"
          elif [ "$magic4" = "504b0304" ]; then
            wad_member="$(zipinfo -1 "$RUNNER_TEMP/wad-source" | awk 'toupper($0) ~ /(^|\/)DOOM1[.]WAD$/ { print; exit }')"
            test -n "$wad_member"
            unzip -p "$RUNNER_TEMP/wad-source" "$wad_member" > "$WAD_PATH"
          elif [ "$magic4" = "49574144" ] || [ "$magic4" = "50574144" ]; then
            cp "$RUNNER_TEMP/wad-source" "$WAD_PATH"
          else
            echo "downloaded file is not a WAD, gzip-compressed WAD, or zip containing DOOM1.WAD" >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/wad-source"

          test "$(dd if="$WAD_PATH" bs=4 count=1 2>/dev/null)" = "IWAD"
          actual_size="$(wc -c < "$WAD_PATH" | tr -d ' ')"
          actual_sha1="$(sha1sum "$WAD_PATH" | awk '{ print $1 }')"
          test "$actual_size" = "$EXPECTED_WAD_BYTES"
          test "$actual_sha1" = "$EXPECTED_WAD_SHA1"
          echo "Validated shareware DOOM1.WAD: ${actual_size} bytes, SHA-1 ${actual_sha1}"

      - name: Rebuild real-WAD image
        run: |
          make clean
          make DOOM_WAD="$WAD_PATH"

      - name: Capture fresh persistence baseline
        if: ${{ inputs.persistence_proof || inputs.persistence_save_slot != '' }}
        run: |
          set -euo pipefail
          cp build/disk.img "$RUNNER_TEMP/disk.before-persistence.img"

      - name: Boot real-WAD image
        id: boot_real_wad
        timeout-minutes: 4
        run: |
          audio_backend="-audiodev none,id=snd0 -device sb16,audiodev=snd0"
          if [ "${AUDIBLE_AUDIO_PROOF}" = "true" ]; then
            audio_backend="-audiodev wav,id=snd0,path=build/doom-audio.wav -device sb16,audiodev=snd0"
          fi

          make \
            DOOM_WAD="$WAD_PATH" \
            ALLOW_LOCAL_VM=1 \
            QEMU_EXTRA_ARGS="$audio_backend" \
            SMOKE_EXPECT_PROBE_GFX=0 \
            SMOKE_CAPTURE_GFX=0 \
            SMOKE_QEMU_TIMEOUT=120 \
            SMOKE_EARLY_SECONDS=2 \
            SMOKE_SETTLE_SECONDS=20 \
            SMOKE_SKIP_ASSERTIONS=1 \
            SMOKE_INPUT_SCRIPT="after-start:wait=2,snapshot after-fire:hold=ctrl:800,wait-status-min=pflags:000000C5:80:2,wait=1,snapshot after-move:hold=up:1200,wait-status-min=pdelta:00000001:80:2,wait=1,snapshot after-use:hold=spc:3000,snapshot,wait=2 after-mouse:mousebtn=1,wait=1,mouse=4:0,wait=1,mousebtn=0,wait=1,mouse=64:0,wait-status-min=pangledelta:00000001:80:2,wait=1,snapshot after-menu:esc,wait=2,snapshot" \
            smoke

      - name: Analyze temporary audible audio capture
        id: audible_audio_capture
        if: ${{ always() && inputs.audible_audio_proof }}
        run: |
          echo "audible_audio_proof still depends on retired WAV analysis; refusing until a minimal shell/C checker exists." >&2
          rm -f build/doom-audio.wav
          exit 1

      - name: Select richest guest status snapshot
        if: always()
        run: |
          set -euo pipefail
          if [ ! -d build ]; then
            echo "No build directory exists; leaving status selection to later diagnostics."
            exit 0
          fi
          if [ -f build/status.txt ]; then
            cp build/status.txt build/status.boot.txt
          fi

          for candidate in \
            build/status.after-mouse.wait-pangledelta.txt \
            build/status.after-move.wait-pdelta.txt \
            build/status.after-fire.wait-pflags.txt \
            build/status.after-menu.txt \
            build/status.after-use.txt \
            build/status.after-mouse.txt \
            build/status.after-move.txt \
            build/status.after-fire.txt \
            build/status.after-start.txt \
            build/status.txt; do
            if [ ! -s "$candidate" ]; then
              continue
            fi
            if grep -q "path=DOOM.ELF" "$candidate" \
              && grep -q "gameplay=OK" "$candidate" \
              && grep -q "pg=ON" "$candidate" \
              && grep -q "vfsops=" "$candidate" \
              && grep -q "audio=SB16" "$candidate"; then
              cp "$candidate" build/status.txt
              echo "Selected $candidate as build/status.txt for proof gates."
              exit 0
            fi
          done

          echo "No richer gameplay status snapshot found; keeping build/status.txt for failure diagnostics."

      - name: Assert real-WAD proof gates
        id: real_wad_proof
        if: always()
        run: |
          set -euo pipefail
          grep -q "path=DOOM.ELF" build/status.txt
          grep -q "doomopen=OK" build/status.txt
          grep -q "doomread=OK" build/status.txt
          grep -q "gameplay=OK" build/status.txt
          perl -ne '$ok = 1 if /gmap=([0-9A-F]{8})/ && hex($1) == 0x00000101; END { exit($ok ? 0 : 1) }' build/status.txt
          perl -ne '$ok = 1 if /doomframe=([0-9A-F]{8})/ && hex($1) > 0; END { exit($ok ? 0 : 1) }' build/status.txt

      - name: Assert scripted human-playability gates
        id: human_playability
        if: always()
        run: |
          set -euo pipefail
          test -s build/status.after-start.txt
          test -s build/status.after-fire.txt
          test -s build/status.after-move.txt
          test -s build/status.after-use.txt
          test -s build/status.after-mouse.txt
          test -s build/status.after-menu.txt
          test -s build/status.after-fire.wait-pflags.txt
          test -s build/status.after-move.wait-pdelta.txt
          test -s build/status.after-mouse.wait-pangledelta.txt
          perl -ne '$ok = 1 if /pflags=([0-9A-F]{8})/ && (hex($1) & 0x00000004) != 0; END { exit($ok ? 0 : 1) }' build/status.after-fire.wait-pflags.txt
          perl -ne '$ok = 1 if /pdelta=([0-9A-F]{8})/ && hex($1) != 0; END { exit($ok ? 0 : 1) }' build/status.after-move.wait-pdelta.txt
          perl -ne '$ok = 1 if /pangledelta=([0-9A-F]{8})/ && hex($1) != 0; END { exit($ok ? 0 : 1) }' build/status.after-mouse.wait-pangledelta.txt

      - name: Assert scripted gameplay transition gates
        id: gameplay_transition
        if: always()
        run: |
          set -euo pipefail
          grep -q "gameplay=OK" build/status.txt
          perl -ne '$ok = 1 if /leveltime=([0-9A-F]{8})/ && hex($1) > 0; END { exit($ok ? 0 : 1) }' build/status.txt
          printf '{ "result": "ok", "gate": "guest-status", "claim": "scripted input changed gameplay state" }\n' > build/gameplay-proof.json

      - name: Assert VM/process legitimacy gates
        id: vm_status
        if: always()
        run: |
          cc -std=c99 -Wall -Wextra -Werror -O2 \
            tools/vibe_status_check.c -o build/vibe_status_check
          build/vibe_status_check \
            --require-exec \
            --require-preempt \
            build/status.txt

      - name: Assert default APIC real-WAD route gates
        id: apic_real_wad
        if: always()
        run: |
          set -euo pipefail
          grep -q "irqctl=APIC" build/status.txt
          grep -q "apic=LIVE" build/status.txt
          grep -q "apicirq=00000001/00000005/00000005" build/status.txt
          grep -q "lapiclive=00000001" build/status.txt
          perl -ne '$ok = 1 if /irqeoi=([0-9A-F]{8})\/([0-9A-F]{8})\/([0-9A-F]{8})/ && hex($3) == 3; END { exit($ok ? 0 : 1) }' build/status.txt

      - name: Assert storage/VFS cloud proof
        id: storage_vfs
        if: always()
        run: |
          set -euo pipefail
          grep -q "vfsops=" build/status.txt
          perl -ne '$ok = 1 if /vfsops=([0-9A-F]{8})/ && hex($1) > 0; END { exit($ok ? 0 : 1) }' build/status.txt
          printf '{ "result": "ok", "gate": "guest-status", "claim": "generic VFS syscalls were exercised" }\n' > build/storage-vfs-proof.json

      - name: Assert SB16 audio continuity gates
        id: audio_continuity
        if: always()
        run: |
          set -euo pipefail
          grep -q "audio=SB16" build/status.txt
          perl -ne '$ok = 1 if /sfxbytes=([0-9A-F]{8})/ && hex($1) > 0; END { exit($ok ? 0 : 1) }' build/status.txt
          perl -ne '$ok = 1 if /musicpull=([0-9A-F]{8})/ && hex($1) > 0; END { exit($ok ? 0 : 1) }' build/status.txt
          perl -ne '$ok = 1 if /pcmwrite=([0-9A-F]{8})/ && hex($1) > 0; END { exit($ok ? 0 : 1) }' build/status.txt
          printf '{ "result": "ok", "gate": "guest-status", "claim": "SB16 PCM path made progress" }\n' > build/audio-proof.json

      - name: Assert audible audio proof manifest
        id: audible_audio_manifest
        if: ${{ always() && inputs.audible_audio_proof }}
        run: |
          echo "audible_audio_proof has no accepted shell/C checker yet." >&2
          exit 1

      - name: Assert gameplay/audio proof bundle
        id: playability_bundle
        if: always()
        run: |
          set -euo pipefail
          test -s build/status.txt
          test -s build/status.after-start.txt
          test -s build/gameplay-proof.json
          test -s build/storage-vfs-proof.json
          grep -q '"result": "ok"' build/gameplay-proof.json
          grep -q '"result": "ok"' build/storage-vfs-proof.json
          if [ -f build/audio-proof.json ]; then
            grep -q '"result": "ok"' build/audio-proof.json
          fi
          if [ "${AUDIBLE_AUDIO_PROOF}" = "true" ]; then
            test -s build/audio-proof.json
          fi

      - name: Triage cloud status
        if: always()
        run: |
          status_file=""
          for candidate in build/status.txt build/status.failure.txt; do
            if [ -f "$candidate" ]; then
              status_file="$candidate"
              break
            fi
          done

          if [ -n "$status_file" ]; then
            echo "Status triage from $status_file"
            tr ' ' '\n' < "$status_file" | grep -E '^(panic|shutdown|exec|path|doom|doomrun|gameplay|gstate|gmap|audio|doomerr|doomerrno|doomfault|fault|pf)=' || true
          else
            echo "No status.txt or status.failure.txt available for triage."
          fi

      - name: Show smoke diagnostics
        if: always()
        run: |
          for file in $(find build -maxdepth 1 -type f -name 'status*.txt' | sort); do
            if [ -f "$file" ]; then
              echo "---- $file ----"
              sed -n '1,220p' "$file"
            fi
          done

      - name: Attempt reboot persistence proof
        id: persistence_proof
        if: ${{ always() && steps.boot_real_wad.outcome == 'success' && (inputs.persistence_proof || inputs.persistence_save_slot != '') }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/disk.before-persistence.img"
          after_write="$RUNNER_TEMP/disk.after-persistence-write.img"
          persistence_write_script="$PERSISTENCE_INPUT_SCRIPT"
          persistence_load_script="$PERSISTENCE_LOAD_INPUT_SCRIPT"
          persistence_default_script=""
          slot_marker_payload=""
          save_description=""
          save_write_timeout="${PERSISTENCE_SAVE_WRITE_TIMEOUT:-45}"
          if [ -n "${PERSISTENCE_SAVE_SLOT:-}" ]; then
            case "$PERSISTENCE_SAVE_SLOT" in
              0|1|2|3|4|5) ;;
              *)
                echo "persistence_save_slot must be 0..5, got '$PERSISTENCE_SAVE_SLOT'." >&2
                exit 1
                ;;
            esac
            slot_marker_payload="$(printf '%*s' "$((PERSISTENCE_SAVE_SLOT + 1))" '' | tr ' ' X)"
            save_description="VIBE SAVE"
            if [ "$persistence_write_script" = "auto" ]; then
              persistence_write_script="save-slot-${PERSISTENCE_SAVE_SLOT}:wait-status=gameplay:OK:150:5,hold=up:1200,wait-status-min=leveltime:00000004:80:2,wait-status-part-min=savewr:1:00000001:${save_write_timeout}:2,wait-status-min=saveclose:00000001:120:2,snapshot"
            fi
            if [ "$persistence_load_script" = "auto" ]; then
              persistence_load_script="load-slot-${PERSISTENCE_SAVE_SLOT}:wait-status=gameplay:OK:150:5,wait-status-part-min=saverd:1:00000001:120:2,wait=2,wait-status=gameplay:OK:60:2,snapshot"
            fi
            persistence_default_script="persist-default:wait-status=gameplay:OK:150:5,wait-status-min=doomwrite:00000001:120:2,wait-status-min=doomclose:00000003:120:2,snapshot"
          else
            if [ "$persistence_write_script" = "auto" ]; then
              persistence_write_script="persist-default:wait-status=gameplay:OK:150:5,wait-status-min=doomwrite:00000001:120:2,wait-status-min=doomclose:00000003:120:2,snapshot"
            fi
            if [ "$persistence_load_script" = "auto" ]; then
              persistence_load_script=""
            fi
          fi
          echo "Persistence write script: ${persistence_write_script:-<none>}"
          echo "Persistence load script: ${persistence_load_script:-<none>}"
          echo "Persistence save-write timeout: ${save_write_timeout}s"

          write_marker() {
            local marker_name="$1"
            local marker_payload="${2:-}"
            build/make_wad_image --write-root-marker "$marker_name" "$marker_payload" build/disk.img
          }

          delete_marker() {
            local marker_name="$1"
            build/make_wad_image --delete-root-marker "$marker_name" build/disk.img
          }

          test -f "$baseline"
          cp "$baseline" build/disk.img
          if [ -z "${PERSISTENCE_SAVE_SLOT:-}" ]; then
            write_marker PERSISTENCE_CHECKPOINT_NAME ""
          else
            write_marker SAVE_REQUEST_NAME "$slot_marker_payload"
          fi

          mkdir -p build/persistence-write
          QEMU=qemu-system-x86_64 \
            QEMU_MACHINE=pc,accel=tcg \
            QEMU_EXTRA_ARGS="-audiodev none,id=snd0 -device sb16,audiodev=snd0" \
            IMAGE=build/disk.img \
            BUILD_DIR=build/persistence-write \
            NC=nc \
            SMOKE_CAPTURE_GFX=0 \
            SMOKE_QEMU_TIMEOUT=620 \
            SMOKE_EARLY_SECONDS=2 \
            SMOKE_SETTLE_SECONDS=20 \
            SMOKE_INPUT_SCRIPT="$persistence_write_script" \
            tests/run_smoke_qemu.sh
          if [ -n "${PERSISTENCE_SAVE_SLOT:-}" ]; then
            write_status="build/persistence-write/status.save-slot-${PERSISTENCE_SAVE_SLOT}.txt"
          else
            write_status="build/persistence-write/status.txt"
          fi
          test -f "$write_status"
          cp "$write_status" build/status.persistence-write.txt

          if [ -n "${PERSISTENCE_SAVE_SLOT:-}" ]; then
            make persistence-image-check \
              PERSISTENCE_BASELINE_IMAGE="$baseline" \
              PERSISTENCE_SAVE_WRITE_STATUS=build/status.persistence-write.txt \
              PERSISTENCE_REQUIRE_SAVE_SLOT="$PERSISTENCE_SAVE_SLOT" \
              PERSISTENCE_REQUIRE_SAVE_DESCRIPTION="${PERSISTENCE_SAVE_SLOT}=${save_description}" \
              PERSISTENCE_REQUIRE_DYNAMIC_FAT_PROOF=1 \
              | tee build/status.persistence-write-proof.txt
          else
            make persistence-image-check \
              PERSISTENCE_BASELINE_IMAGE="$baseline" \
              PERSISTENCE_WRITE_STATUS=build/status.persistence-write.txt \
              PERSISTENCE_REQUIRE_DEFAULT=1 \
              PERSISTENCE_REQUIRE_DYNAMIC_FAT_PROOF=1 \
              | tee build/status.persistence-write-proof.txt
          fi

          if [ -n "${PERSISTENCE_SAVE_SLOT:-}" ]; then
            delete_marker SAVE_REQUEST_NAME
            write_marker PERSISTENCE_CHECKPOINT_NAME ""
            mkdir -p build/persistence-default
            QEMU=qemu-system-x86_64 \
              QEMU_MACHINE=pc,accel=tcg \
              QEMU_EXTRA_ARGS="-audiodev none,id=snd0 -device sb16,audiodev=snd0" \
              IMAGE=build/disk.img \
              BUILD_DIR=build/persistence-default \
              NC=nc \
              SMOKE_CAPTURE_GFX=0 \
              SMOKE_QEMU_TIMEOUT=420 \
              SMOKE_EARLY_SECONDS=2 \
              SMOKE_SETTLE_SECONDS=20 \
              SMOKE_INPUT_SCRIPT="$persistence_default_script" \
              tests/run_smoke_qemu.sh
            cp build/persistence-default/status.txt build/status.persistence-default.txt
            make persistence-image-check \
              PERSISTENCE_BASELINE_IMAGE="$baseline" \
              PERSISTENCE_SAVE_WRITE_STATUS=build/status.persistence-write.txt \
              PERSISTENCE_WRITE_STATUS=build/status.persistence-default.txt \
              PERSISTENCE_REQUIRE_SAVE_SLOT="$PERSISTENCE_SAVE_SLOT" \
              PERSISTENCE_REQUIRE_SAVE_DESCRIPTION="${PERSISTENCE_SAVE_SLOT}=${save_description}" \
              PERSISTENCE_REQUIRE_DEFAULT=1 \
              PERSISTENCE_REQUIRE_DYNAMIC_FAT_PROOF=1 \
              | tee build/status.persistence-default-proof.txt
            cp build/disk.img "$after_write"
            write_marker LOAD_REQUEST_NAME "$slot_marker_payload"

            mkdir -p build/persistence-load
            QEMU=qemu-system-x86_64 \
              QEMU_MACHINE=pc,accel=tcg \
              QEMU_EXTRA_ARGS="-audiodev none,id=snd0 -device sb16,audiodev=snd0" \
              IMAGE=build/disk.img \
              BUILD_DIR=build/persistence-load \
              NC=nc \
              SMOKE_CAPTURE_GFX=0 \
              SMOKE_QEMU_TIMEOUT=420 \
              SMOKE_EARLY_SECONDS=2 \
              SMOKE_SETTLE_SECONDS=12 \
              SMOKE_INPUT_SCRIPT="$persistence_load_script" \
              tests/run_smoke_qemu.sh
            load_status="build/persistence-load/status.load-slot-${PERSISTENCE_SAVE_SLOT}.txt"
            if [ ! -f "$load_status" ]; then
              load_status="build/persistence-load/status.txt"
            fi
            cp "$load_status" build/status.persistence-load.txt
            cp build/status.persistence-load.txt build/status.persistence-reboot.txt

            make persistence-image-check \
              PERSISTENCE_BASELINE_IMAGE="$baseline" \
              PERSISTENCE_REBOOT_BASELINE_IMAGE="$after_write" \
              PERSISTENCE_LOAD_STATUS=build/status.persistence-load.txt \
              PERSISTENCE_REQUIRE_SAVE_SLOT="$PERSISTENCE_SAVE_SLOT" \
              PERSISTENCE_REQUIRE_SAVE_DESCRIPTION="${PERSISTENCE_SAVE_SLOT}=${save_description}" \
              PERSISTENCE_REQUIRE_DEFAULT=1 \
              | tee build/status.persistence-load-proof.txt
            cp build/status.persistence-load-proof.txt build/status.persistence-reboot-proof.txt
          else
            cp build/disk.img "$after_write"
            mkdir -p build/persistence-reboot
            QEMU=qemu-system-x86_64 \
              QEMU_MACHINE=pc,accel=tcg \
              QEMU_EXTRA_ARGS="-audiodev none,id=snd0 -device sb16,audiodev=snd0" \
              IMAGE=build/disk.img \
              BUILD_DIR=build/persistence-reboot \
              NC=nc \
              SMOKE_CAPTURE_GFX=0 \
              SMOKE_QEMU_TIMEOUT=180 \
              SMOKE_EARLY_SECONDS=2 \
              SMOKE_SETTLE_SECONDS=12 \
              tests/run_smoke_qemu.sh
            cp build/persistence-reboot/status.txt build/status.persistence-reboot.txt

            make persistence-image-check \
              PERSISTENCE_BASELINE_IMAGE="$baseline" \
              PERSISTENCE_REBOOT_STATUS=build/status.persistence-reboot.txt \
              PERSISTENCE_REQUIRE_DEFAULT=1 \
              | tee build/status.persistence-reboot-proof.txt
          fi

      - name: Show persistence diagnostics
        if: ${{ always() && (inputs.persistence_proof || inputs.persistence_save_slot != '') }}
        run: |
          set -euo pipefail

          if [ ! -d build ]; then
            echo "No build directory exists; persistence proof did not reach diagnostics."
            exit 0
          fi

          echo "Persistence diagnostics preserve status text and JSON only; no WAD, disk image, pixels, screenshots, raw audio, logs, tokens, or one-time codes are uploaded."
          diagnostic_files="$(find build -maxdepth 2 -type f \( \
            -name 'status.persistence*.txt' -o \
            -path 'build/persistence-*/*.txt' -o \
            -path 'build/persistence-*/*.json' \
          \) | sort)"

          if [ -z "$diagnostic_files" ]; then
            echo "No persistence diagnostic files were produced."
            exit 0
          fi

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            echo "---- $file ----"
            sed -n '1,220p' "$file" || true
          done <<< "$diagnostic_files"

          find build -maxdepth 2 -type f \( \
            -name 'status.persistence*.txt' -o \
            -path 'build/persistence-*/*.txt' \
          \) | sort | while IFS= read -r file; do
            case "$file" in
              *.triage.txt|*proof.txt) continue ;;
            esac
            if grep -q 'doomrun=' "$file"; then
              triage_file="${file%.txt}.triage.txt"
              echo "---- triage $file ----"
              tr ' ' '\n' < "$file" | grep -E '^(panic|shutdown|exec|path|doom|doomrun|gameplay|gstate|gmap|audio|doomerr|doomerrno|doomfault|fault|pf)=' | tee "$triage_file" || true
            fi
          done

          find build -maxdepth 2 -type f -path 'build/persistence-*/*.txt' | sort | while IFS= read -r file; do
            phase="$(basename "$(dirname "$file")")"
            name="$(basename "$file")"
            cp "$file" "build/status.${phase}.${name}"
          done

      - name: Re-check validated WAD after smoke
        if: always()
        run: |
          actual_size="$(wc -c < "$WAD_PATH" | tr -d ' ')"
          actual_sha1="$(sha1sum "$WAD_PATH" | awk '{ print $1 }')"
          test "$actual_size" = "$EXPECTED_WAD_BYTES"
          test "$actual_sha1" = "$EXPECTED_WAD_SHA1"
          echo "Post-smoke WAD still validated locally: ${actual_size} bytes, SHA-1 ${actual_sha1}"
          rm -f "$WAD_PATH" "$RUNNER_TEMP/wad-source"
          rm -f build/vga*.bin build/vga*.txt
          rm -f build/persistence-*/vga*.bin build/persistence-*/vga*.txt

      - name: Write cloud proof run identity
        if: always()
        run: |
          mkdir -p build
          cat > build/cloud-proof-run.json <<JSON
          {
            "schema": "cloud-proof-run-v1",
            "workflow": "real-wad-smoke.yml",
            "artifact": "real-wad-smoke-proof-status",
            "ref": "${GITHUB_REF_NAME:-}",
            "sha": "${GITHUB_SHA:-}",
            "run_id": "${GITHUB_RUN_ID:-}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT:-}",
            "runner": "github-actions-ubuntu",
            "local_qemu_required": false,
            "artifact_policy": {
              "status_only": true,
              "contains_wad_data": false,
              "contains_disk_image": false,
              "contains_screenshots": false,
              "contains_pixels": false,
              "contains_raw_audio": false
            }
          }
          JSON

      - name: Upload status-only proof artifact
        id: upload_proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-wad-smoke-proof-status
          if-no-files-found: ignore
          path: |
            build/cloud-proof-run.json
            build/audio-proof.json
            build/gameplay-proof.json
            build/storage-vfs-proof.json
            build/status*.txt
            build/persistence-*/*.json
            build/persistence-*/*.txt

      - name: Summarize proof lane outcomes and reruns
        if: always()
        env:
          AUDIBLE_REQUESTED: ${{ inputs.audible_audio_proof }}
          PERSISTENCE_REQUESTED: ${{ inputs.persistence_proof || inputs.persistence_save_slot != '' }}
          BOOT_OUTCOME: ${{ steps.boot_real_wad.outcome }}
          REAL_WAD_OUTCOME: ${{ steps.real_wad_proof.outcome }}
          HUMAN_OUTCOME: ${{ steps.human_playability.outcome }}
          GAMEPLAY_OUTCOME: ${{ steps.gameplay_transition.outcome }}
          VM_STATUS_OUTCOME: ${{ steps.vm_status.outcome }}
          STORAGE_VFS_OUTCOME: ${{ steps.storage_vfs.outcome }}
          BUNDLE_OUTCOME: ${{ steps.playability_bundle.outcome }}
          AUDIO_CAPTURE_OUTCOME: ${{ steps.audible_audio_capture.outcome }}
          AUDIO_CONTINUITY_OUTCOME: ${{ steps.audio_continuity.outcome }}
          AUDIO_MANIFEST_OUTCOME: ${{ steps.audible_audio_manifest.outcome }}
          PERSISTENCE_OUTCOME: ${{ steps.persistence_proof.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_proof.outcome }}
        run: |
          set -euo pipefail

          lane_state() {
            local requested="$1"
            shift
            if [ "$requested" != "true" ]; then
              printf 'not-requested'
              return
            fi
            local outcome
            for outcome in "$@"; do
              case "$outcome" in
                success|skipped) ;;
                *) printf 'red'; return ;;
              esac
            done
            printf 'green'
          }

          gameplay_state="$(lane_state true \
            "$BOOT_OUTCOME" \
            "$REAL_WAD_OUTCOME" \
            "$HUMAN_OUTCOME" \
            "$GAMEPLAY_OUTCOME" \
            "$VM_STATUS_OUTCOME" \
            "$STORAGE_VFS_OUTCOME" \
            "$BUNDLE_OUTCOME")"

          audio_outcomes=("$AUDIO_CONTINUITY_OUTCOME")
          if [ "$AUDIBLE_REQUESTED" = "true" ]; then
            audio_outcomes+=("$AUDIO_CAPTURE_OUTCOME" "$AUDIO_MANIFEST_OUTCOME")
          fi
          audio_state="$(lane_state true "${audio_outcomes[@]}")"
          persistence_state="$(lane_state "$PERSISTENCE_REQUESTED" "$PERSISTENCE_OUTCOME")"

          rerun_commands=()
          if [ "$gameplay_state" = "red" ]; then
            rerun_commands+=("gh workflow run real-wad-smoke.yml --repo \"$GITHUB_REPOSITORY\" --ref \"$GITHUB_REF_NAME\" -f expected_ref=\"$GITHUB_REF_NAME\"")
          fi
          if [ "$audio_state" = "red" ]; then
            rerun_commands+=("Audio lane needs a minimal shell/C checker before rerun automation is enabled")
          fi
          if [ "$persistence_state" = "red" ]; then
            rerun_commands+=("gh workflow run real-wad-smoke.yml --repo \"$GITHUB_REPOSITORY\" --ref \"$GITHUB_REF_NAME\" -f persistence_save_slot=0 -f audible_audio_proof=false -f expected_ref=\"$GITHUB_REF_NAME\"")
          fi

          {
            echo "### Proof lane outcomes"
            echo ""
            echo "| Lane | State | Checks |"
            echo "| --- | --- | --- |"
            echo "| gameplay/input | $gameplay_state | boot=$BOOT_OUTCOME, real_wad=$REAL_WAD_OUTCOME, human=$HUMAN_OUTCOME, gameplay=$GAMEPLAY_OUTCOME, vm=$VM_STATUS_OUTCOME, storage_vfs=$STORAGE_VFS_OUTCOME, bundle=$BUNDLE_OUTCOME |"
            echo "| audio | $audio_state | sb16_continuity=$AUDIO_CONTINUITY_OUTCOME, audible_capture=$AUDIO_CAPTURE_OUTCOME, audible_manifest=$AUDIO_MANIFEST_OUTCOME |"
            echo "| persistence/save-load | $persistence_state | persistence=$PERSISTENCE_OUTCOME |"
            echo "| artifact upload | $UPLOAD_OUTCOME | real-wad-smoke-proof-status status/JSON only |"
            echo ""
            echo "Artifact policy: no WADs, disk images, screenshots, rendered pixels, raw audio, logs, tokens, or one-time codes are uploaded."
            echo ""
            echo "#### Rerun only the red lane"
            if [ "${#rerun_commands[@]}" -eq 0 ]; then
              echo "No red proof lane was detected."
            else
              echo ""
              echo '```sh'
              printf '%s\n' "${rerun_commands[@]}"
              echo '```'
              echo ""
              echo "If boot/build failed, rerun gameplay first; rerun audio or persistence only after gameplay is green."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
